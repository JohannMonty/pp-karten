<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Positive Psychologie – Karteikarten</title>
<meta name="description" content="Karteikarten zur Klausurvorbereitung Positive Psychologie (FOM, Prof. Dr. Schorlemmer)">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PosPsy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#0b1220; --bg2:#111c2e; --fg:#e8eef6; --muted:#93a4bd;
    --accent:#2dd4bf; --accent2:#0f766e; --good:#34d399; --again:#fbbf24;
    --card:#16233a; --line:#25354f; --radius:20px;
    --dia:#2dd4bf;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f7fb; --bg2:#ffffff; --fg:#10203a; --muted:#5c6f8c;
           --card:#ffffff; --line:#dde5f0; --dia:#0f766e; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none; overflow-x:hidden;
  }

  header{ padding:10px 14px 6px; border-bottom:1px solid var(--line); background:var(--bg2); }
  .row{ display:flex; gap:8px; align-items:center; }
  .row.wrap{ flex-wrap:wrap; }
  h1{ font-size:clamp(12px,3.6vw,15px); margin:0; font-weight:700; letter-spacing:.2px; flex:1; min-width:0; }
  select, button{ font:inherit; color:var(--fg); }
  select{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:8px 10px; max-width:100%; flex:1; min-width:0;
  }
  .pill{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 10px; font-size:clamp(11px,3vw,13px); cursor:pointer; white-space:nowrap;
    min-width:0; overflow:hidden; text-overflow:ellipsis;
  }
  .pill.on{ background:var(--accent2); border-color:var(--accent2); color:#fff; }
  .bar{ height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:10px; }
  .bar > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .25s; }
  .meta{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }

  main{ flex:1; display:flex; padding:14px; min-height:0; }
  .scene{ flex:1; perspective:1400px; min-height:0; }
  .card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 18px; display:flex; flex-direction:column; overflow:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    -webkit-overflow-scrolling:touch;
  }
  .face.back{ transform:rotateY(180deg); }
  .tag{ font-size:11px; letter-spacing:.8px; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:12px; }
  .q{ font-size:clamp(18px,4.6vw,24px); font-weight:650; line-height:1.35; white-space:pre-wrap; }
  .a{ font-size:clamp(15px,3.8vw,18px); white-space:pre-wrap; }
  .gfx{ margin:2px 0 14px; }
  .gfx:empty{ display:none; }
  .gfx svg{ width:100%; height:auto; display:block; }
  .gfx text{ font-family:inherit; fill:currentColor; }
  .gfx .ln{ stroke:currentColor; opacity:.3; fill:none; stroke-width:1; }
  .gfx .bx{ stroke:var(--dia); fill:none; stroke-width:1.4; }
  .gfx .bxf{ stroke:var(--dia); stroke-width:1.4; fill:var(--dia); fill-opacity:.1; }
  .gfx .fl{ fill:var(--dia); opacity:.13; }
  .gfx .ac{ fill:var(--dia); }
  .gfx .ar{ stroke:var(--dia); fill:none; stroke-width:1.4; }
  .gfx .mu{ opacity:.62; }
  .hint{ margin-top:auto; padding-top:14px; font-size:12px; color:var(--muted); }
  .src{ margin-top:14px; font-size:12px; color:var(--muted); font-style:italic; }

  footer{ padding:10px 14px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg2); }
  .btns{ display:flex; gap:10px; }
  .btn{
    flex:1 1 0; min-width:0; padding:14px 4px; border-radius:16px; border:1px solid var(--line);
    background:var(--card); font-weight:650; font-size:clamp(13px,3.6vw,15px); cursor:pointer;
    white-space:nowrap;
  }
  .btn.again{ background:var(--again); border-color:var(--again); color:#3b2a02; }
  .btn.good{ background:var(--good); border-color:var(--good); color:#053526; }
  .btn.flip{ background:var(--accent2); border-color:var(--accent2); color:#fff; }
  .mini{ display:flex; gap:8px; margin-top:8px; }
  .mini .pill{ flex:1; text-align:center; }
  .done{ text-align:center; padding:40px 20px; }
  .done h2{ margin:0 0 10px; }
</style>
</head>
<body>

<header>
  <div class="row">
    <h1>Positive Psychologie · Karteikarten</h1>
    <button class="pill" id="shuffle" title="Mischen">Mischen</button>
  </div>
  <div class="row wrap" style="margin-top:8px">
    <select id="cat"></select>
    <button class="pill" id="modeBtn" title="Nur schwierige Karten">Alle</button>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="meta">
    <span id="counter">–</span>
    <span id="stats">–</span>
  </div>
</header>

<main>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <div class="tag" id="tagF">–</div>
        <div class="q" id="qText">Lade …</div>
        <div class="hint">Tippen zum Umdrehen</div>
      </div>
      <div class="face back">
        <div class="tag" id="tagB">–</div>
        <div class="gfx" id="gfxBox"></div>
        <div class="a" id="aText"></div>
        <div class="src" id="srcText"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="btns">
    <button class="btn again" id="btnAgain">Nochmal</button>
    <button class="btn flip" id="btnFlip">Umdrehen</button>
    <button class="btn good" id="btnGood">Gewusst</button>
  </div>
  <div class="mini">
    <button class="pill" id="btnPrev">◀</button>
    <button class="pill" id="btnReset">Zurücksetzen</button>
    <button class="pill" id="btnNext">▶</button>
  </div>
</footer>

<script id="cards" type="application/json">
[
{"c":"0 Kernwissen · muss sitzen","i":400,"q":"Definiere Positive Psychologie und beschreibe den Perspektivenwechsel.","a":"DEFINITION\nDie wissenschaftliche Erforschung dessen, was das Leben lebenswert macht. Ein Aufruf, sich genauso mit Stärken wie mit Schwächen zu beschäftigen, die besten Dinge zu fördern wie die schlimmsten zu reparieren und das Leben normaler Menschen erfüllter zu machen wie Pathologie zu heilen.\n\nMERKSATZ\nNicht „alles positiv sehen“, sondern wissenschaftlich untersuchen, welche Bedingungen Menschen, Gruppen und Organisationen aufblühen lassen.\n\nSie ergänzt die klinische Psychologie, ersetzt sie nicht. Negative Emotionen gelten als funktional.","s":"Snyder & Lopez (2021) · Klausurfrage 1","g":"<svg viewBox='0 0 330 142'><text x='0' y='10' font-size='8.5' class='mu'>VON</text><text x='186' y='10' font-size='8.5' class='mu'>ZU</text><g font-size='10.5'><text x='0' y='34'>Pathogenese</text><text x='162' y='34' class='ac' font-size='13'>→</text><text x='186' y='34' class='ac' font-weight='700'>Salutogenese</text><text x='0' y='62'>Schwächen korrigieren</text><text x='162' y='62' class='ac' font-size='13'>→</text><text x='186' y='62' class='ac' font-weight='700'>Stärken aufbauen</text><text x='0' y='90'>negative Emotionen</text><text x='162' y='90' class='ac' font-size='13'>→</text><text x='186' y='90' class='ac' font-weight='700'>positive Emotionen</text><text x='0' y='118'>Problembehebung</text><text x='162' y='118' class='ac' font-size='13'>→</text><text x='186' y='118' class='ac' font-weight='700'>Lebensqualität</text></g></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":401,"q":"Grenze Glück, Wohlbefinden und Lebenszufriedenheit voneinander ab.","a":"Im Alltag synonym, wissenschaftlich unterscheidbar und miteinander verbunden.\n\nRelevanz für Coaching: Wer „unglücklich“ sagt, kann zu wenig positive Emotionen, zu wenig Sinn ODER eine negative Lebensbilanz meinen. Daraus folgen völlig unterschiedliche Interventionen – Genusstraining oder Wertearbeit.","s":"Klausurfrage 2","g":"<svg viewBox='0 0 330 176'><rect class='bxf' x='0' y='0' width='330' height='52' rx='6'/><text x='10' y='21' font-size='12' font-weight='700' class='ac'>Wohlbefinden</text><text x='10' y='37' font-size='9' class='mu'>Dachkonzept · hedonisch + eudaimonisch · „Blühe ich auf?“</text><rect class='bx' x='0' y='62' width='330' height='52' rx='6'/><text x='10' y='83' font-size='12' font-weight='700'>Glück</text><text x='10' y='99' font-size='9' class='mu'>mehrdeutig · Moment = State, Lebensglück = Trait</text><rect class='bx' x='0' y='124' width='330' height='52' rx='6'/><text x='10' y='145' font-size='12' font-weight='700'>Lebenszufriedenheit</text><text x='10' y='161' font-size='9' class='mu'>kognitives Urteil über das Leben als Ganzes · SWLS</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":402,"q":"Erkläre hedonisches und eudaimonisches Wohlbefinden.","a":"HEDONISCH – „Feeling Good“\nErleben positiver Emotionen und Abwesenheit negativer. Affektiv, kurzfristig, situationsabhängig.\nBeispiel: ein schöner Abend mit Freunden.\nForscher: Kahneman\n\nEUDAIMONISCH – „Functioning Well“\nErfülltes Leben im Einklang mit eigenen Werten und Potenzialen. Wachstum, Sinn, Authentizität, Stärkeneinsatz. Langfristig, prozesshaft.\nBeispiel: eine anstrengende, aber sinnvolle Aufgabe zu Ende bringen.\nForscher: Aristoteles, Ryff, Deci & Ryan","s":"Klausurfrage 3","g":"<svg viewBox='0 0 330 148'><rect class='bx' x='0' y='0' width='158' height='148' rx='6'/><rect class='bx' x='172' y='0' width='158' height='148' rx='6'/><text x='79' y='22' font-size='11' font-weight='700' class='ac' text-anchor='middle'>Hedonisch</text><text x='79' y='37' font-size='9' class='mu' text-anchor='middle'>„Feeling Good“</text><text x='12' y='62' font-size='9'>• positive Emotionen</text><text x='12' y='79' font-size='9'>• Freude, Genuss</text><text x='12' y='96' font-size='9'>• affektiv</text><text x='12' y='113' font-size='9'>• kurzfristig</text><text x='79' y='136' font-size='8.5' class='mu' text-anchor='middle'>Wie fühle ich mich?</text><text x='251' y='22' font-size='11' font-weight='700' class='ac' text-anchor='middle'>Eudaimonisch</text><text x='251' y='37' font-size='9' class='mu' text-anchor='middle'>„Functioning Well“</text><text x='184' y='62' font-size='9'>• Sinn und Werte</text><text x='184' y='79' font-size='9'>• Wachstum</text><text x='184' y='96' font-size='9'>• Authentizität</text><text x='184' y='113' font-size='9'>• langfristig</text><text x='251' y='136' font-size='8.5' class='mu' text-anchor='middle'>Lebe ich sinnvoll?</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":403,"q":"Woraus besteht Subjektives Wohlbefinden nach Diener?","a":"Zwei Komponenten, vier Bestandteile:\n\nAFFEKTIV\n• Positiver Affekt – Häufigkeit und Intensität positiver Gefühle\n• Negativer Affekt – Häufigkeit und Intensität negativer Gefühle\n\nKOGNITIV\n• Lebenszufriedenheit – globale Bewertung\n• Domänenspezifische Zufriedenheit – z. B. Arbeit, Gesundheit, Beziehungen\n\nWICHTIG: Es geht nicht nur darum, wie sich jemand fühlt, sondern auch darum, wie er sein Leben bewertet.","s":"Diener et al. (1999)","g":"<svg viewBox='0 0 330 160'><rect class='bxf' x='70' y='0' width='190' height='30' rx='6'/><text x='165' y='20' font-size='10.5' font-weight='700' class='ac' text-anchor='middle'>Subjektives Wohlbefinden</text><path class='ar' d='M165 30 V44 M80 44 H250 M80 44 V58 M250 44 V58'/><rect class='bx' x='0' y='58' width='160' height='26' rx='5'/><text x='80' y='75' font-size='9.5' text-anchor='middle'>affektive Komponente</text><rect class='bx' x='170' y='58' width='160' height='26' rx='5'/><text x='250' y='75' font-size='9.5' text-anchor='middle'>kognitive Komponente</text><path class='ar' d='M80 84 V96 M38 96 H122 M38 96 V108 M122 96 V108'/><rect class='bx' x='0' y='108' width='76' height='40' rx='5'/><text x='38' y='125' font-size='8.5' text-anchor='middle'>positiver</text><text x='38' y='137' font-size='8.5' text-anchor='middle'>Affekt</text><rect class='bx' x='84' y='108' width='76' height='40' rx='5'/><text x='122' y='125' font-size='8.5' text-anchor='middle'>negativer</text><text x='122' y='137' font-size='8.5' text-anchor='middle'>Affekt</text><path class='ar' d='M250 84 V96 M208 96 H292 M208 96 V108 M292 96 V108'/><rect class='bx' x='170' y='108' width='76' height='40' rx='5'/><text x='208' y='125' font-size='8.5' text-anchor='middle'>Lebens-</text><text x='208' y='137' font-size='8.5' text-anchor='middle'>zufriedenheit</text><rect class='bx' x='254' y='108' width='76' height='40' rx='5'/><text x='292' y='125' font-size='8.5' text-anchor='middle'>domänen-</text><text x='292' y='137' font-size='8.5' text-anchor='middle'>spezifisch</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":404,"q":"Erkläre die 50-40-10-Formel des Glücks.","a":"• ca. 50 % Set-Point / genetische Veranlagung\n• ca. 40 % absichtsvolle Aktivitäten\n• ca. 10 % Lebensumstände\n\nKERNAUSSAGE\nWohlbefinden ist weder durch Gene noch durch Umstände festgelegt – ein erheblicher Teil ist aktiv gestaltbar. Genau darauf setzen Coaching und Intervention.\n\nDREI ARTEN ABSICHTSVOLLER AKTIVITÄTEN\n• kognitiv: Dankbarkeit, Optimismus, positive Erlebnisse auskosten\n• verhaltensbezogen: Beziehungen pflegen, Bewegung, Gutes tun\n• volitional: Selbstregulation und Dranbleiben\n\nACHTUNG: In manchen Zusammenfassungen sind 40 und 10 vertauscht. Richtig ist 40 % Aktivitäten, 10 % Umstände.","s":"Lyubomirsky, Sheldon & Schkade (2005)","g":"<svg viewBox='0 0 330 118'><rect class='bxf' x='0' y='0' width='165' height='42'/><rect class='bx' x='165' y='0' width='132' height='42'/><rect class='bx' x='297' y='0' width='33' height='42'/><text x='82' y='27' font-size='13' font-weight='700' class='ac' text-anchor='middle'>50 %</text><text x='231' y='27' font-size='13' font-weight='700' text-anchor='middle'>40 %</text><text x='313' y='27' font-size='10' font-weight='700' text-anchor='middle'>10 %</text><text x='0' y='64' font-size='9.5' font-weight='700'>50 %  Set-Point / genetische Veranlagung</text><text x='0' y='84' font-size='9.5' font-weight='700'>40 %  absichtsvolle Aktivitäten</text><text x='0' y='104' font-size='9.5' font-weight='700'>10 %  Lebensumstände</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":405,"q":"Beschreibe das PERMA-V-Modell.","a":"P – Positive Emotionen: Freude, Dankbarkeit, Hoffnung ermöglichen\nE – Engagement: im Tun aufgehen, Flow, Stärken nutzen\nR – Relationships: tragfähige, unterstützende Beziehungen\nM – Meaning: Sinn, Werte, Beitrag zu etwas Größerem\nA – Accomplishment: Zielerreichung, Kompetenz, Fortschritt\nV – Vitalität: Energie, Schlaf, Bewegung, Gesundheit\n\nZIEL: zunehmendes Aufblühen (Flourishing) durch Verstärkung dieser Elemente.\n\nBEDEUTUNG FÜR COACHING: PERMA erlaubt eine differenzierte Diagnostik statt pauschaler Aussagen über „Zufriedenheit“ – man sieht genau, welches Element fehlt, und kann dort ansetzen.","s":"Seligman (2011); V nach Zhivotovskaya (2016, 2021) · Klausurfrage 4","g":"<svg viewBox='0 0 330 148'><g><rect class='bx' x='0' y='0' width='50' height='108' rx='5'/><text x='25' y='31' font-size='18' font-weight='700' class='ac' text-anchor='middle'>P</text><text x='25' y='55' font-size='9' text-anchor='middle'>Positive</text><text x='25' y='67' font-size='9' text-anchor='middle'>Emotion</text><rect class='bx' x='56' y='0' width='50' height='108' rx='5'/><text x='81' y='31' font-size='18' font-weight='700' class='ac' text-anchor='middle'>E</text><text x='81' y='55' font-size='9' text-anchor='middle'>Engage-</text><text x='81' y='67' font-size='9' text-anchor='middle'>ment</text><text x='81' y='83' font-size='8.5' class='mu' text-anchor='middle'>Flow</text><rect class='bx' x='112' y='0' width='50' height='108' rx='5'/><text x='137' y='31' font-size='18' font-weight='700' class='ac' text-anchor='middle'>R</text><text x='137' y='55' font-size='9' text-anchor='middle'>Relation-</text><text x='137' y='67' font-size='9' text-anchor='middle'>ships</text><rect class='bx' x='168' y='0' width='50' height='108' rx='5'/><text x='193' y='31' font-size='18' font-weight='700' class='ac' text-anchor='middle'>M</text><text x='193' y='55' font-size='9' text-anchor='middle'>Meaning</text><text x='193' y='71' font-size='8.5' class='mu' text-anchor='middle'>Sinn</text><rect class='bx' x='224' y='0' width='50' height='108' rx='5'/><text x='249' y='31' font-size='18' font-weight='700' class='ac' text-anchor='middle'>A</text><text x='249' y='55' font-size='9' text-anchor='middle'>Accom-</text><text x='249' y='67' font-size='9' text-anchor='middle'>plishment</text><rect class='bx' x='280' y='0' width='50' height='108' rx='5'/><text x='305' y='31' font-size='18' font-weight='700' class='ac' text-anchor='middle'>V</text><text x='305' y='55' font-size='9' text-anchor='middle'>Vitalität</text></g><line class='ln' x1='0' y1='116' x2='330' y2='116'/><text x='165' y='138' font-size='11' font-weight='700' class='ac' text-anchor='middle'>Flourishing – Aufblühen</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":406,"q":"Welche drei Kriterien muss ein Element erfüllen, um ein PERMA-Element zu sein?","a":"1. Es trägt zum Wohlbefinden bei.\n2. Es wird um seiner selbst willen verfolgt.\n3. Es ist unabhängig von den anderen Elementen und messbar.","s":""},

{"c":"0 Kernwissen · muss sitzen","i":407,"q":"Definiere Flow und erkläre, unter welchen Bedingungen er entsteht.","a":"DEFINITION\nEin Zustand des vollkommenen und reflexionsfreien Vertiefens und Aufgehens in einer Tätigkeit, die persönlich herausfordernd ist und dennoch optimal gelingt, also glatt und fließend abläuft.\n\nENTSTEHUNG\nIn der Balance zwischen persönlicher Fähigkeit (skill) und Anforderung der Aufgabe (challenge).\n• Anforderung zu niedrig → Langeweile\n• Anforderung zu hoch → Überforderung, Angst\n• optimale Passung → Flow\n\nWIRKUNGEN\n• affektiv: positive Gefühle\n• kognitiv: Aufmerksamkeit und Konzentration\n• konativ: Leistung und Erfolg\n• physiologisch: Cortisol moderat erhöht\n\nEinordnung in PERMA: Flow ist der Kern von E – Engagement.","s":"Csikszentmihályi (1975, 2002) · Klausurfrage 6","g":"<svg viewBox='0 0 330 202'><polygon class='fl' points='30,160 30,120 300,20 300,60'/><line class='ln' x1='30' y1='10' x2='30' y2='175'/><line class='ln' x1='30' y1='175' x2='316' y2='175'/><text x='88' y='50' font-size='10' font-weight='700'>Überforderung</text><text x='88' y='64' font-size='9' class='mu'>Angst</text><text x='206' y='138' font-size='10' font-weight='700'>Langeweile</text><text x='206' y='152' font-size='9' class='mu'>Unterforderung</text><text x='150' y='106' font-size='15' font-weight='700' class='ac' transform='rotate(-20 150 106)'>FLOW</text><text transform='rotate(-90 14 92)' x='14' y='92' font-size='8.5' class='mu' text-anchor='middle'>Anforderung (challenge)</text><text x='173' y='194' font-size='8.5' class='mu' text-anchor='middle'>Fähigkeit (skill)</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":408,"q":"Erläutere die Broaden-and-Build-Theorie und ihre Bedeutung für Change-Prozesse.","a":"BROADEN – Erweitern\nPositive Emotionen erweitern Aufmerksamkeit, Denken und Handlungsspielräume: kreativer, offener, mehr Möglichkeiten, leichter soziale Kontakte. Weitblick statt Tunnelblick.\n\nBUILD – Aufbauen\nDadurch werden langfristig Ressourcen aufgebaut:\n• intellektuell: Wissen, Problemlösen\n• physisch: Koordination, Kraft\n• sozial: Freundschaften, Netzwerke\n• psychologisch: Resilienz, Optimismus, Selbstwirksamkeit\n\nBEDEUTUNG FÜR COACHING UND CHANGE\nErst positive Emotionen schaffen die Voraussetzung dafür, dass Menschen aus dem Tunnelblick herauskommen, Ressourcen erkennen und Alternativen entwickeln. Ohne sie bleibt der Möglichkeitsraum eng – Veränderung wird unwahrscheinlich.","s":"Fredrickson (2001) · Klausurfrage 5","g":"<svg viewBox='0 0 330 212'><rect class='bxf' x='44' y='0' width='246' height='30' rx='8'/><text x='167' y='20' font-size='11' font-weight='700' class='ac' text-anchor='middle'>Positive Emotionen</text><path class='ar' d='M167 30 V44'/><path class='ac' d='M162 42 L172 42 L167 50 Z'/><rect class='bx' x='44' y='50' width='246' height='36' rx='8'/><text x='167' y='67' font-size='11' font-weight='700' text-anchor='middle'>BROADEN</text><text x='167' y='80' font-size='8' class='mu' text-anchor='middle'>Aufmerksamkeit, Denken und Handeln erweitern</text><path class='ar' d='M167 86 V100'/><path class='ac' d='M162 98 L172 98 L167 106 Z'/><rect class='bx' x='44' y='106' width='246' height='36' rx='8'/><text x='167' y='123' font-size='11' font-weight='700' text-anchor='middle'>BUILD</text><text x='167' y='136' font-size='8' class='mu' text-anchor='middle'>intellektuell · physisch · sozial · psychologisch</text><path class='ar' d='M167 142 V156'/><path class='ac' d='M162 154 L172 154 L167 162 Z'/><rect class='bx' x='44' y='162' width='246' height='30' rx='8'/><text x='167' y='182' font-size='11' font-weight='700' text-anchor='middle'>mehr Ressourcen</text><path class='ar' d='M44 177 Q8 177 8 98 Q8 15 44 15'/><path class='ac' d='M42 10 L42 20 L50 15 Z'/><text transform='rotate(-90 26 100)' x='26' y='100' font-size='8' class='ac' text-anchor='middle'>Aufwärtsspirale</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":409,"q":"Was sind Charakterstärken und wie werden sie in der Beratung genutzt?","a":"DEFINITION\nPsychologische Merkmale, die Tugenden definieren. Sie bilden einen Teil der Persönlichkeit ab, sind über Situationen und Zeit relativ stabil, können sich aber durch Lebenserfahrungen weiterentwickeln.\n\nSTÄRKEN-CHECK – woran erkenne ich eine Stärke?\n1. Sie drängt aus mir heraus und gibt Energie.\n2. Es fehlt etwas, wenn ich sie nicht ausleben kann.\n3. Es kostet Energie, sie zurückzuhalten.\n4. Es kommt vor, dass ich mehr davon mache, als gut ist.\n\nIN DER BERATUNG\nIdentifizieren: „Wann fühlen Sie sich energiegeladen?“, „Was fällt Ihnen leicht?“, „Wofür bekommen Sie Komplimente?“\nEinsetzen: „Wie könnte Ihnen diese Stärke helfen, Ihr Ziel zu erreichen?“, „Wann hat sie Ihnen schon einmal geholfen?“\n\nKlassifikation: VIA mit 6 Tugenden und 24 Stärken.\nStärkenorientierung ist kein Schönreden.","s":"Seligman & Peterson (2004); Ebner (2024) · Klausurfrage 7"},

{"c":"0 Kernwissen · muss sitzen","i":410,"q":"Erkläre das Doppel-Kontinuum der mentalen Gesundheit nach Keyes.","a":"Zwei UNABHÄNGIGE Dimensionen:\n• Vorliegen einer psychischen Erkrankung\n• Ausmaß des mentalen Wohlbefindens\n\nDaraus ergeben sich vier Zustände.\n\nKERNAUSSAGE\nMentale Gesundheit ist nicht die Abwesenheit psychischer Krankheit. Wer keine Diagnose hat, ist nicht automatisch mental gesund – das ist genau der Bereich Languishing.\n\nFÜR COACHING\nCoaches sind „Architekten des Aufblühens“, nicht nur Reparateure von Defiziten. Fokus auf die vertikale Achse: von Languishing zu Flourishing begleiten. Bei klinischen Themen Kooperation mit Therapeut:innen.","s":"Keyes (2002) · Klausurfrage 10","g":"<svg viewBox='0 0 330 212'><text transform='rotate(-90 12 100)' x='12' y='100' font-size='8.5' class='mu' text-anchor='middle'>mentales Wohlbefinden</text><rect class='bx' x='28' y='8' width='292' height='168' rx='6'/><line class='ln' x1='174' y1='8' x2='174' y2='176'/><line class='ln' x1='28' y1='92' x2='320' y2='92'/><text x='101' y='34' font-size='11.5' font-weight='700' class='ac' text-anchor='middle'>Flourishing</text><text x='101' y='50' font-size='9.5' text-anchor='middle'>Aufblühen</text><text x='101' y='70' font-size='8' class='mu' text-anchor='middle'>keine Erkrankung,</text><text x='101' y='81' font-size='8' class='mu' text-anchor='middle'>hohes Wohlbefinden</text><text x='247' y='34' font-size='11.5' font-weight='700' class='ac' text-anchor='middle'>Kämpfend</text><text x='247' y='60' font-size='8' class='mu' text-anchor='middle'>Erkrankung, aber</text><text x='247' y='71' font-size='8' class='mu' text-anchor='middle'>hohes Wohlbefinden</text><text x='101' y='118' font-size='11.5' font-weight='700' class='ac' text-anchor='middle'>Languishing</text><text x='101' y='134' font-size='9.5' text-anchor='middle'>Verkümmern</text><text x='101' y='154' font-size='8' class='mu' text-anchor='middle'>keine Erkrankung,</text><text x='101' y='165' font-size='8' class='mu' text-anchor='middle'>niedriges Wohlbefinden</text><text x='247' y='118' font-size='11.5' font-weight='700' class='ac' text-anchor='middle'>Strauchelnd</text><text x='247' y='144' font-size='8' class='mu' text-anchor='middle'>Erkrankung und</text><text x='247' y='155' font-size='8' class='mu' text-anchor='middle'>niedriges Wohlbefinden</text><text x='101' y='194' font-size='8.5' class='mu' text-anchor='middle'>keine psychische Erkrankung</text><text x='247' y='194' font-size='8.5' class='mu' text-anchor='middle'>psychische Erkrankung</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":411,"q":"Wie hängen Salutogenese, mentale Gesundheit, Wohlbefinden und Resilienz zusammen?","a":"• SALUTOGENESE = übergeordnetes Paradigma mit Ressourcenfokus. Leitfrage: Was hält gesund? (Gegenstück: Pathogenese – Was macht krank?)\n\n• MODELL MENTALER GESUNDHEIT (Keyes) = differenziertes Diagnosemodell, um den Zustand einer Person zu verorten.\n\n• WOHLBEFINDEN / FLOURISHING = Ziel bzw. Optimalzustand innerhalb dieses Modells.\n\n• RESILIENZ = dynamischer Prozess bzw. Motor, der Bewegung im Modell ermöglicht: schützt vor dem Abrutschen in Krankheit (horizontal) und treibt Wachstum Richtung Flourishing an (vertikal).\n\nKOHÄRENZSINN (Antonovsky): Verstehbarkeit, Handhabbarkeit, Sinnhaftigkeit. Hohe Kohärenz aktiviert Ressourcen.","s":"Klausurfrage 10","g":"<svg viewBox='0 0 330 186'><rect class='bxf' x='0' y='0' width='330' height='34' rx='6'/><text x='165' y='15' font-size='11' font-weight='700' class='ac' text-anchor='middle'>SALUTOGENESE</text><text x='165' y='28' font-size='8' class='mu' text-anchor='middle'>übergeordnetes Paradigma · Was hält gesund?</text><path class='ar' d='M165 34 V46'/><path class='ac' d='M160 44 L170 44 L165 52 Z'/><rect class='bx' x='0' y='52' width='330' height='62' rx='6'/><text x='165' y='69' font-size='10.5' font-weight='700' text-anchor='middle'>Modell mentaler Gesundheit (Keyes)</text><text x='165' y='82' font-size='8' class='mu' text-anchor='middle'>Diagnosemodell · wo steht die Person?</text><rect class='bxf' x='55' y='88' width='220' height='20' rx='10'/><text x='165' y='102' font-size='9' font-weight='700' class='ac' text-anchor='middle'>Flourishing = Ziel / Optimalzustand</text><path class='ar' d='M165 130 V118'/><path class='ac' d='M160 120 L170 120 L165 112 Z'/><rect class='bx' x='0' y='130' width='330' height='44' rx='6'/><text x='165' y='148' font-size='11' font-weight='700' text-anchor='middle'>RESILIENZ</text><text x='165' y='164' font-size='8' class='mu' text-anchor='middle'>dynamischer Prozess · der Motor der Bewegung im Modell</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":412,"q":"Definiere Resilienz und grenze sie von den gängigen Mythen ab.","a":"DEFINITION (nach APA)\nDer Prozess der guten Anpassung angesichts von Widrigkeiten, Traumata, Tragödien, Bedrohungen oder signifikanten Stressquellen.\n→ nicht statisch, sondern flexibel und dynamisch\n→ es gibt nicht DIE eine einheitliche Definition\n→ trainierbarer Prozess, keine angeborene Eigenschaft\n\nDIE FÜNF MYTHEN – alle FALSCH\n1. „Schnell wieder der/die Alte sein“ → oft eher posttraumatisches Wachstum, eine veränderte, reifere Version\n2. „Härte, dickes Fell“ → nötig ist psychologische Flexibilität und Emotionsakzeptanz\n3. „Nur in großen Krisen nötig“ → auch Alltagsstress, Mikro-Resilienz\n4. „Resiliente brauchen keine Hilfe“ → soziale Unterstützung ist eine zentrale Säule\n5. „Optimismus ist entscheidend“ → zentral ist REALISTISCHER Optimismus plus Akzeptanz, Lösungen und Unterstützung","s":"APA; Wessa (2025) · Klausurfrage 8"},

{"c":"0 Kernwissen · muss sitzen","i":413,"q":"Nenne die 7 Säulen der Resilienz.","a":"1. AKZEPTANZ – annehmen, was nicht veränderbar ist, Energie auf das Machbare lenken\n2. OPTIMISMUS – Glaube an eine positive Zukunft und die eigene Gestaltungsfähigkeit\n3. LÖSUNGSORIENTIERUNG – Fokus auf Lösungen statt auf Probleme\n4. SELBSTWIRKSAMKEIT – Opferrolle verlassen, Einfluss auf das eigene Leben nehmen\n5. VERANTWORTUNG – für eigenes Handeln und Fühlen übernehmen\n6. NETZWERKORIENTIERUNG – soziale Unterstützung aktiv pflegen und nutzen\n7. ZUKUNFTSPLANUNG – realistische und sinnstiftende Ziele setzen","s":"Reivich & Shatté (2002); Rampe (2005) · Klausurfrage 9","g":"<svg viewBox='0 0 330 162'><rect class='bxf' x='0' y='0' width='330' height='26' rx='6'/><text x='165' y='18' font-size='11.5' font-weight='700' class='ac' text-anchor='middle'>RESILIENZ</text><rect class='bx' x='0' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 21 89)' x='21' y='89' font-size='9' text-anchor='middle'>Akzeptanz</text><rect class='bx' x='48' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 69 89)' x='69' y='89' font-size='9' text-anchor='middle'>Optimismus</text><rect class='bx' x='96' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 117 89)' x='117' y='89' font-size='9' text-anchor='middle'>Lösungen</text><rect class='bx' x='144' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 165 89)' x='165' y='89' font-size='8.5' text-anchor='middle'>Selbstwirksamkeit</text><rect class='bx' x='192' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 213 89)' x='213' y='89' font-size='9' text-anchor='middle'>Verantwortung</text><rect class='bx' x='240' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 261 89)' x='261' y='89' font-size='9' text-anchor='middle'>Netzwerk</text><rect class='bx' x='288' y='34' width='42' height='110' rx='4'/><text transform='rotate(-90 309 89)' x='309' y='89' font-size='9' text-anchor='middle'>Zukunftsplanung</text><line class='ln' x1='0' y1='152' x2='330' y2='152'/></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":414,"q":"Erkläre das ABCDE-Modell.","a":"Werkzeug zur kognitiven Umstrukturierung, Teil des Master Resilience Trainings.\n\nSCHRITT D – DISPUTATION im Detail, die vier Prüffragen:\n• Evidenz: Welche Beweise gibt es wirklich dafür? Welche dagegen?\n• Alternativen: Gibt es eine wohlwollendere oder realistischere Erklärung?\n• Nützlichkeit: Hilft mir dieser Gedanke oder blockiert er mich?\n• Worst Case (De-Katastrophisierung): Selbst wenn es stimmte – was wäre das Schlimmste? Könnte ich damit umgehen?","s":"Seligman (2011), Master Resilience Training · Klausurfrage 9","g":"<svg viewBox='0 0 330 196'><circle class='bxf' cx='17' cy='17' r='15'/><text x='17' y='22' font-size='13' font-weight='700' class='ac' text-anchor='middle'>A</text><text x='42' y='13' font-size='10.5' font-weight='700'>Adversity – Auslöser</text><text x='42' y='27' font-size='8.5' class='mu'>Was ist objektiv passiert?</text><path class='ar' d='M17 32 V40'/><circle class='bxf' cx='17' cy='55' r='15'/><text x='17' y='60' font-size='13' font-weight='700' class='ac' text-anchor='middle'>B</text><text x='42' y='51' font-size='10.5' font-weight='700'>Beliefs – Bewertungen</text><text x='42' y='65' font-size='8.5' class='mu'>Welche Gedanken gingen mir durch den Kopf?</text><path class='ar' d='M17 70 V78'/><circle class='bxf' cx='17' cy='93' r='15'/><text x='17' y='98' font-size='13' font-weight='700' class='ac' text-anchor='middle'>C</text><text x='42' y='89' font-size='10.5' font-weight='700'>Consequences – Folgen</text><text x='42' y='103' font-size='8.5' class='mu'>Welche Gefühle und welches Verhalten folgten?</text><path class='ar' d='M17 108 V116'/><circle class='bxf' cx='17' cy='131' r='15'/><text x='17' y='136' font-size='13' font-weight='700' class='ac' text-anchor='middle'>D</text><text x='42' y='127' font-size='10.5' font-weight='700'>Disputation – Diskussion</text><text x='42' y='141' font-size='8.5' class='mu'>Evidenz · Alternativen · Nützlichkeit · Worst Case</text><path class='ar' d='M17 146 V154'/><circle class='bxf' cx='17' cy='169' r='15'/><text x='17' y='174' font-size='13' font-weight='700' class='ac' text-anchor='middle'>E</text><text x='42' y='165' font-size='10.5' font-weight='700'>Energization – neue Energie</text><text x='42' y='179' font-size='8.5' class='mu'>Wie fühle ich mich jetzt? Was ist der nächste Schritt?</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":415,"q":"Was liegt in meiner Hand? Erkläre Einfluss- und Betroffenheitsbereich.","a":"BETROFFENHEITSBEREICH (Circle of Concern)\nAlles, was mich beschäftigt und betrifft, worauf ich aber keinen Einfluss habe.\n→ Hier gilt das Prinzip AKZEPTANZ.\n\nEINFLUSSBEREICH (Circle of Influence)\nDas, worauf ich tatsächlich einwirken kann.\n→ Hier gilt das GESTALTUNGSPRINZIP.\n\nKERN: KONTROLLE\nDas eigene Verhalten und die eigenen Gedanken.\n\nIn der Beratung extrem nützlich, um Ziele realistisch zu verorten – und um Interventionen nicht an unveränderbaren Umständen scheitern zu lassen.","s":"Covey (1989, 2004)","g":"<svg viewBox='0 0 330 172'><ellipse class='bx' cx='165' cy='86' rx='162' ry='80'/><ellipse class='bx' cx='165' cy='86' rx='106' ry='54'/><ellipse class='bxf' cx='165' cy='86' rx='54' ry='28'/><text x='165' y='83' font-size='9' font-weight='700' class='ac' text-anchor='middle'>Kontrolle</text><text x='165' y='96' font-size='8.5' class='mu' text-anchor='middle'>Verhalten + Gedanken</text><text x='165' y='48' font-size='9.5' font-weight='700' text-anchor='middle'>Einflussbereich</text><text x='165' y='22' font-size='9.5' font-weight='700' text-anchor='middle'>Betroffenheitsbereich</text><text x='165' y='150' font-size='8' class='mu' text-anchor='middle'>Gestaltungsprinzip</text><text x='165' y='167' font-size='8' class='mu' text-anchor='middle'>Akzeptanz</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":416,"q":"Nenne die vier Strategien des Positive Leadership nach Cameron.","a":"Ziel: „positiv deviante“ Leistungen ermöglichen – Ergebnisse weit über dem Durchschnitt. Es geht nicht darum, Probleme zu ignorieren, sondern Bedingungen für außergewöhnliches Gedeihen zu schaffen.\n\nKONTRASTBEISPIELE\nKlima: statt „Wer ist schuld?“ → „Was lernen wir daraus?“\nBeziehungen: statt „Direkt zur Sache“ → „Wie geht es Ihnen?“\nKommunikation: statt Jahreskritikgespräch → regelmäßiges Stärken-Feedback\nSinn: statt „X % Umsatz“ → „Wir helfen Kunden, Y zu erreichen“","s":"Cameron (2012) · Klausurfrage 11","g":"<svg viewBox='0 0 330 152'><rect class='bx' x='0' y='0' width='160' height='70' rx='6'/><text x='80' y='24' font-size='10' font-weight='700' class='ac' text-anchor='middle'>Positive Climate</text><text x='80' y='42' font-size='8' class='mu' text-anchor='middle'>Empathie, Dankbarkeit,</text><text x='80' y='54' font-size='8' class='mu' text-anchor='middle'>psychologische Sicherheit</text><rect class='bx' x='170' y='0' width='160' height='70' rx='6'/><text x='250' y='24' font-size='10' font-weight='700' class='ac' text-anchor='middle'>Positive Relationships</text><text x='250' y='42' font-size='8' class='mu' text-anchor='middle'>Energie geben statt</text><text x='250' y='54' font-size='8' class='mu' text-anchor='middle'>entziehen, Vertrauen</text><rect class='bx' x='0' y='80' width='160' height='70' rx='6'/><text x='80' y='104' font-size='10' font-weight='700' class='ac' text-anchor='middle'>Positive Communication</text><text x='80' y='122' font-size='8' class='mu' text-anchor='middle'>bekräftigende Sprache,</text><text x='80' y='134' font-size='8' class='mu' text-anchor='middle'>hohe Positiv-Ratio</text><rect class='bx' x='170' y='80' width='160' height='70' rx='6'/><text x='250' y='104' font-size='10' font-weight='700' class='ac' text-anchor='middle'>Positive Meaning</text><text x='250' y='122' font-size='8' class='mu' text-anchor='middle'>Arbeit mit Werten</text><text x='250' y='134' font-size='8' class='mu' text-anchor='middle'>verbinden</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":417,"q":"Vergleiche Positive Leadership nach Cameron mit PERMA-Lead nach Ebner.","a":"PERMA-LEAD überträgt PERMA auf Führung: positive Emotionen ermöglichen, Engagement und Flow fördern, Beziehungen stärken, Sinn vermitteln, Erreichtes sichtbar machen.\n\nGEMEINSAMKEITEN\n• beide ressourcen- und stärkenorientiert\n• beide betonen Sinn (Meaning) und positive Beziehungen (Relationships)\n• beide zielen auf Win-Win: Wohlbefinden UND Leistung\n\nEVIDENZ (Ebner, Krankenhaus)\nJe höher das PERMA-Lead-Verhalten, desto geringer Fluktuationsneigung (r = -.291) und Burnout (r = -.392), jeweils p < 0,001.\n\nDIAGNOSTIK\nProfiler, Leadership-/Managementkompetenzen, Führungs- und Organisationskulturanalyse. Entwicklungspotenzial zeigt sich in der Differenz zwischen Verhalten und eigener Erwartung.","s":"Cameron (2012); Ebner (2017, 2024) · Klausurfrage 11","g":"<svg viewBox='0 0 330 140'><rect class='bx' x='0' y='0' width='158' height='140' rx='6'/><rect class='bx' x='172' y='0' width='158' height='140' rx='6'/><text x='79' y='20' font-size='10.5' font-weight='700' class='ac' text-anchor='middle'>Cameron</text><text x='79' y='44' font-size='8.5' font-weight='700' text-anchor='middle'>FOKUS</text><text x='79' y='58' font-size='8' class='mu' text-anchor='middle'>organisationaler Kontext</text><text x='79' y='69' font-size='8' class='mu' text-anchor='middle'>und Kultur</text><text x='79' y='95' font-size='8.5' font-weight='700' text-anchor='middle'>ANWENDUNG</text><text x='79' y='109' font-size='8' class='mu' text-anchor='middle'>strategische Richtung</text><text x='79' y='120' font-size='8' class='mu' text-anchor='middle'>für Kulturentwicklung</text><text x='251' y='20' font-size='10.5' font-weight='700' class='ac' text-anchor='middle'>PERMA-Lead</text><text x='251' y='44' font-size='8.5' font-weight='700' text-anchor='middle'>FOKUS</text><text x='251' y='58' font-size='8' class='mu' text-anchor='middle'>individuelle Bedürfnisse</text><text x='251' y='69' font-size='8' class='mu' text-anchor='middle'>der Mitarbeitenden</text><text x='251' y='95' font-size='8.5' font-weight='700' text-anchor='middle'>ANWENDUNG</text><text x='251' y='109' font-size='8' class='mu' text-anchor='middle'>Framework für den</text><text x='251' y='120' font-size='8' class='mu' text-anchor='middle'>Führungsalltag</text></svg>"},

{"c":"0 Kernwissen · muss sitzen","i":418,"q":"Stelle die zentralen Kritikpunkte an der Positiven Psychologie dar und ordne sie ein.","a":"1. OBERFLÄCHLICHKEIT\nKonstrukte wie Glück und Wohlbefinden sind komplex; gesellschaftliche und biografische Voraussetzungen wirken als Moderatorvariablen.\n\n2. IDEOLOGISCHE TENDENZEN\nStark mit Seligman verbunden; Vorwürfe der „Zwangsbeglückung“ (Utsch) und der „Aufgabe, das Glück zu finden“ (Ahmed). Nach Salamun lassen sich Ideologiemerkmale identifizieren.\n\n3. DICHOTOMISIERUNG\nScharfe Trennung Pathologie vs. Positive Psychologie erweckt den Eindruck, andere Richtungen hätten Stärken nie betrachtet – auch die WHO-Definition enthält längst Wohlbefinden.\n\n4. TOXISCHE POSITIVITÄT\nProblematisch, wenn negative Emotionen abgewertet werden. Sie sind funktional: Angst warnt, Ärger zeigt Grenzen, Trauer verarbeitet.\n\nDIFFERENZIERTE ANTWORT (Van Zyl, 2025)\n• proaktiver Reformprozess in der Disziplin\n• eher Miteinander als Gegeneinander, interdisziplinärer Raum\n• seriöse PP fordert keine permanenten positiven Emotionen – Wohlbefinden ist mehrdimensional\n• Forschung schreitet voran\n\nKLAUSURHALTUNG: Kritik nicht als Widerlegung verstehen, sondern als Aufforderung zu differenzierter, kontextsensibler Anwendung.","s":"Mayring (2012); Van Zyl (2025) · Klausurfrage 12"},

{"c":"0 Kernwissen · muss sitzen","i":419,"q":"Welche drei Kritikpunkte gelten speziell für das Resilienzkonzept?","a":"1. INDIVIDUALISIERUNG UND VICTIM BLAMING\nDer Fokus auf individuelle Resilienz lenkt von systemischen Problemen ab. Statt ein toxisches Arbeitsumfeld zu ändern, soll der Mitarbeitende „resilienter“ werden – Verantwortung wandert vom System zum Individuum.\n\n2. DRUCK ZUR UNVERWUNDBARKEIT / TOXISCHE POSITIVITÄT\nLegitime negative Emotionen werden unterdrückt. Resilienz wird mit dem Fehlen emotionaler Reaktion verwechselt – echte Verarbeitung und posttraumatisches Wachstum werden verhindert.\n\n3. KULTURELLE UND KONTEXTUELLE BLINDHEIT\nModelle wie die 7 Säulen sind westlich-individualistisch geprägt. In kollektivistischen Kulturen können soziale Harmonie und Gemeinschaft zentraler sein.\n\nFORSCHUNGSLÜCKEN\n• geringe Effektstärken einzelner Faktoren\n• Mangel an Längsschnittdaten vor dem Ereignis\n• zu starker Fokus auf Individuen statt auf soziale Mechanismen","s":"Welsh (2021)"},

{"c":"0 Kernwissen · muss sitzen","i":420,"q":"Welche Begriffe und Zahlen sollten wörtlich sitzen?","a":"PERSONEN UND IHRE MODELLE\n• Seligman – PERMA, Begründer, Master Resilience Training\n• Fredrickson – Broaden-and-Build\n• Csikszentmihályi – Flow\n• Peterson & Seligman – Charakterstärken, VIA\n• Diener – Subjektives Wohlbefinden, SWLS\n• Ryff – Psychologisches Wohlbefinden, 6 Dimensionen\n• Keyes – Doppel-Kontinuum mentaler Gesundheit\n• Antonovsky – Salutogenese, Kohärenzsinn\n• Lyubomirsky – 50-40-10-Formel\n• Cameron – Positive Leadership, 4 Strategien\n• Ebner – PERMA-Lead\n• Covey – Einfluss- und Betroffenheitsbereich\n• Reivich & Shatté / Rampe – 7 Säulen der Resilienz\n\nZAHLEN\n• PERMA-V: 6 Elemente, 3 Kriterien je Element\n• VIA: 6 Tugenden, 24 Stärken\n• Ryff: 6 Dimensionen\n• Resilienz: 7 Säulen, MRT mit 6 Kernkompetenzen\n• Keyes: 4 Zustände\n• Cameron: 4 Strategien\n• 50-40-10\n• SWLS: 5 Items, 7-stufig · HSWBS: 13 Items, 6-stufig\n• Flow-Kurzskala: 7-stufig, Flow / Besorgnis / Passung","s":""},

{"c":"0 Kernwissen · muss sitzen","i":421,"q":"Welche 12 Fragen gelten als typische Klausurfragen?","a":"1. Positive Psychologie definieren und den Perspektivenwechsel von Pathogenese zu Salutogenese erläutern\n2. Glück, Wohlbefinden und Lebenszufriedenheit abgrenzen\n3. Hedonisches und eudaimonisches Wohlbefinden mit Beispielen erklären\n4. PERMA(V) beschreiben und die Bedeutung für Coaching darstellen\n5. Broaden-and-Build erläutern und auf Change-Prozesse beziehen\n6. Flow definieren und die Entstehungsbedingungen erklären\n7. Charakterstärken beschreiben und die Nutzung in der Beratung zeigen\n8. Resilienz definieren und von Mythen abgrenzen\n9. Die 7 Säulen und das ABCDE-Modell erläutern\n10. Zusammenhang von Resilienz, Salutogenese und mentaler Gesundheit erklären\n11. Cameron mit PERMA-Lead vergleichen\n12. Kritikpunkte an der Positiven Psychologie darstellen und diskutieren","s":"Klausurzusammenfassung, Abschnitt 8"},

{"c":"0 Kernwissen · muss sitzen","i":422,"q":"Wie ist die Klausur aufgebaut und wie teile ich mir die Zeit ein?","a":"• 90 Minuten, 100 % der Modulnote\n• maximal 90 Punkte: 90 Punkte = 1,0 · 45 Punkte = 4,0 (bestanden)\n• mindestens 10 %, voraussichtlich 30 % Transferleistung (vorab bekannt)\n\nFRAGEARTEN\n• Offene Fragen – Zeit an der Punktzahl orientieren\n• Multiple Choice – die Anzahl der korrekten Optionen ist angegeben. MEHR Kreuze als angegeben = 0 Punkte für die Aufgabe\n• ggf. Lückentexte\n\nFAUSTREGEL: 1 Punkt ≈ 1 Minute Schreibzeit.\nDie Transferaufgabe entspricht damit rund 27 Minuten.\n\nOrientierung an den Lernzielen der einzelnen Abschnitte.","s":"Skript 06"},

{"c":"0 Kernwissen · muss sitzen","i":423,"q":"Welche sechs Themen sind laut Eingrenzung klausurrelevant?","a":"1. Einführung und Hauptentwicklungen\n2. Wohlbefinden, Glück und Lebenszufriedenheit\n3. PERMA(V): Vertiefung und Anwendung\n4. Resilienz\n5. Positive Leadership und PERMA-Lead\n6. Kritik und Grenzen der Positiven Psychologie\n\nNICHT klausurrelevant: Best Possible Self (laut Skript ausdrücklich ausgenommen).","s":"Skript 06, Folie 16"},

{"c":"1 Grundlagen","q":"Wie wird Positive Psychologie definiert?","a":"Die wissenschaftliche Erforschung dessen, was das Leben lebenswert macht.\n\nEin Aufruf an psychologische Wissenschaft und Anwendung,\n• sich genauso mit menschlichen Stärken zu beschäftigen wie mit Schwächen,\n• genauso daran interessiert zu sein, die besten Dinge im Leben zu fördern, wie die schlimmsten zu reparieren,\n• sich ebenso damit zu befassen, das Leben normaler Menschen erfüllter zu machen, wie damit, Pathologie zu heilen.","s":"Snyder & Lopez (2021), S. 23 ff."},
{"c":"1 Grundlagen","q":"Merksatz: Was bedeutet Positive Psychologie NICHT?","a":"Sie bedeutet nicht „alles positiv reden“ oder dauerhaft gute Laune.\n\nSie fragt wissenschaftlich: Was lässt Menschen, Gruppen und Organisationen aufblühen (Flourishing)?\n\nSie ergänzt die klinische/defizitorientierte Psychologie, ersetzt sie aber nicht. Negative Emotionen gelten als funktional und notwendig.","s":""},
{"c":"1 Grundlagen","q":"Wer gilt als Begründer der modernen Positiven Psychologie – und in welchem Kontext?","a":"Martin E. P. Seligman.\n\n• Perspektivenwechsel nach dem 2. Weltkrieg\n• APA-Rede 1998 – „Die neue Psychologie“\n• Zitat: „For the last 60 years psychology has been consumed with a single topic only – mental illness. And it forgot about making normal people happier.“","s":"Seligman (2012), Flourish"},
{"c":"1 Grundlagen","q":"Welchen vierfachen Perspektivenwechsel beschreibt die Positive Psychologie?","a":"1) Pathogenese → Salutogenese\n2) Korrektur von Schwächen → Aufbau von Stärken\n3) Negative Emotionen → Positive Emotionen & Kreativität\n4) Reine Problembehebung → Aufbau von Lebensqualität, Wohlbefinden und Stärken","s":""},
{"c":"1 Grundlagen","q":"Nenne die zentralen Ziele der Positiven Psychologie.","a":"• Stärkung individueller Erfüllung und Stärken\n• Leben normaler Menschen erfüllter machen\n• Wohlbefinden, Zufriedenheit, Flow, Freude und Glück fördern\n• Zukunftsorientierung: Optimismus, Hoffnung, Glaube\n• Prävention psychischer Belastungen durch Aufbau von Ressourcen und Kompetenzen\n• Psychologie nicht nur zur Problembehebung, sondern zum Aufbau von Lebensqualität","s":""},
{"c":"1 Grundlagen","q":"Wie sind die Schwerpunkte der Positiven Psychologie zeitlich gegliedert?","a":"Vergangenheit und Gegenwart:\n• Wohlbefinden & Zufriedenheit\n• Flow, Freude und Glück\n\nZukunft:\n• Optimismus, Hoffnung & Glaube\n\nJeweils auf individueller und auf Gruppenebene.","s":""},
{"c":"1 Grundlagen","q":"Was bedeutet der präventive Charakter der Positiven Psychologie?","a":"Fokus auf den Schutz vor psychischen Krankheiten durch Aufbau von Stärken, Kompetenzen und positiven Eigenschaften (z. B. Optimismus, Resilienz, mentale Stärke).\n\nMethode: Trainingsprogramme (z. B. Resilienz, Achtsamkeit) zur Stärkung vorhandener Stärken.\n\nBisher wenig in der Psychotherapie genutzt, aber fester Bestandteil in Coaching und Beratung – Tendenz steigend. Anwendung auch auf gesellschaftlicher und organisationaler Ebene.","s":""},
{"c":"1 Grundlagen","q":"Wie ist die Positive Psychologie institutionell verankert?","a":"• APA (American Psychological Association) seit 1998\n• DGPP (Deutsche Gesellschaft für Positive Psychologie) seit 2015\n• Hohe Interdisziplinarität\n• Fachkongresse: IPPA World Congress, ECPP, DGPPF","s":""},
{"c":"1 Grundlagen","q":"Was ist die „4. Welle“ der Positiven Psychologie?","a":"Der Schwerpunkt auf Posttraumatischem Wachstum – vertreten u. a. durch Prof. Dr. Judith Mangelsdorf.\n\nKernaussage: Menschen können aus Krisen nicht nur zurückkehren, sondern gereift und verändert hervorgehen.","s":""},
{"c":"1 Grundlagen","q":"Was ist mit der kulturellen Einbettung der Positiven Psychologie gemeint?","a":"Die Konstrukte sind kulturell geprägt:\n• Verständnis und Rolle von Achtsamkeit, Meditation etc.\n• Relevanz einzelner Stärken und Charaktereigenschaften\n• Glückstraditionen und Verständnis von Glück\n• Zusammenspiel von Geist und Seele\n\nIndividualistische Kulturen: Selbstwert, persönliche Erfolge, individuelle Zielerreichung.\nKollektivistische Kulturen: soziale Harmonie, Pflichterfüllung, Beziehungsqualität.\n\nKlausurhinweis: Modelle dürfen nicht unreflektiert universalisiert werden.","s":""},
{"c":"1 Grundlagen","q":"Welche Anwendungsfelder hat die Positive Psychologie?","a":"• Coaching und Beratung\n• Arbeits- und Organisationskontexte\n• Führung (Positive Leadership)\n• Prävention und Gesundheitsförderung\n• Change-Prozesse\n• Bildung und gesellschaftliche Ebene","s":""},
{"c":"1 Grundlagen","q":"Welche zwei Modellgrundlagen nennt das Skript für die Positive Psychologie?","a":"1) PERMA-V-Modell (Seligman 2011, Erweiterung von Zhivotovskaya 2016/2021)\n2) Modell des positiven Selbstmanagements (Braun et al., 2020)","s":""},
{"c":"1 Grundlagen","q":"Welche Rolle spielen positive Emotionen und Charakterstärken als Grundbausteine?","a":"Beide sind zentrale Grundlagen der Positiven Psychologie:\n\n• Positive Emotionen eröffnen Handlungs- und Denkräume (→ Broaden-and-Build)\n• Charakterstärken machen individuelle Ressourcen sichtbar und für Entwicklung nutzbar","s":""},

{"c":"2 Wohlbefinden & Glück","q":"Erkläre die Unterscheidung State vs. Trait.","a":"State = situationsspezifischer, aktueller Zustand (z. B. momentane Freude)\nTrait = überdauernde Eigenschaft/Tendenz (z. B. langfristiges Lebensglück)\n\nParallele zur Angstforschung: akute Angst (State) vs. Ängstlichkeit (Trait).","s":"Mayring (2020)"},
{"c":"2 Wohlbefinden & Glück","q":"Wie unterscheiden sich Emotion und Affekt?","a":"Emotion: Gefühl nach innen gerichtet, wird kognitiv reflektiert, hat einen Bezug, ist komplexer.\n\nAffekt: nach außen sichtbar, kurzfristiger, instinktiver.","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Ist Glück ein State oder ein Trait?","a":"Beides:\n• Momentanes Glücksgefühl = State\n• Langfristiges Lebensglück = Trait","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Warum ist „Glück“ ein vieldeutiger Oberbegriff? In welche zwei Hauptkomponenten wird es zerlegt?","a":"In der Positiven Psychologie wird „Glück“ (happiness) zerlegt in:\n\n1) Hedonisches Wohlbefinden – „Feeling Good“\n2) Eudaimonisches Wohlbefinden – „Functioning Well“","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Beschreibe hedonisches Wohlbefinden („Feeling Good“).","a":"Definition: Erleben positiver Emotionen (Freude, Vergnügen, Genuss) und Abwesenheit negativer Emotionen.\n\nFokus: affektiver, gefühlsmäßiger Aspekt des Lebens\nZeitliche Natur: oft kurzfristig, situationsabhängig, Momentzustand\nLeitfrage: „Wie fühle ich mich gerade jetzt?“\nWichtiger Forscher: Daniel Kahneman (erlebendes vs. erinnerndes Selbst)","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Beschreibe eudaimonisches Wohlbefinden („Functioning Well“).","a":"Definition: Ein erfülltes Leben im Einklang mit den eigenen Werten und Potenzialen – Selbstverwirklichung und Sinnhaftigkeit.\n\nFokus: Wachstum, Sinn, Authentizität, Einbringen der eigenen Stärken\nZeitliche Natur: langfristig, prozesshaft, eine Lebenshaltung\nLeitfrage: „Lebe ich ein sinnvolles und authentisches Leben?“\nWichtige Vertreter: Aristoteles (Eudaimonia), Carol Ryff, Deci & Ryan (Selbstbestimmungstheorie)","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Aus welchen Komponenten besteht Subjektives Wohlbefinden nach Diener?","a":"Affektive Komponenten:\n• Positiver Affekt (Häufigkeit/Intensität positiver Gefühle)\n• Negativer Affekt (Häufigkeit/Intensität negativer Gefühle)\n\nKognitive Komponenten:\n• Lebenszufriedenheit (globale Bewertung)\n• Domänenspezifische Zufriedenheit (z. B. Arbeit, Gesundheit, Beziehungen)","s":"Diener et al. (1999)"},
{"c":"2 Wohlbefinden & Glück","q":"Definiere Lebenszufriedenheit.","a":"Lebenszufriedenheit ist eine kognitive, globale Bewertung des eigenen Lebens im Vergleich zu einem selbst gesetzten Standard.\n\n• Kognitiv: ein Gedanke/Urteil, kein Gefühl\n• Global: bezieht sich auf das Leben als Ganzes\n• Vergleich mit Standard: hängt von eigenen Erwartungen, Zielen und Werten ab","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Welche besonderen Merkmale hat Lebenszufriedenheit?","a":"• Reflexiv: erfordert Nachdenken und bewusste Bewertung\n• Relativ stabil: ändert sich langsamer als momentane Stimmungen\n• Gut messbar: z. B. Satisfaction with Life Scale (SWLS) von Ed Diener","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Nenne die 5 Items der deutschen Satisfaction with Life Scale (SWLS).","a":"1. In den meisten Bereichen entspricht mein Leben meinen Idealvorstellungen.\n2. Meine Lebensbedingungen sind ausgezeichnet.\n3. Ich bin mit meinem Leben zufrieden.\n4. Bisher habe ich die wesentlichen Dinge erreicht, die ich mir für mein Leben wünsche.\n5. Wenn ich mein Leben noch einmal leben könnte, würde ich kaum etwas ändern.\n\n7-stufiges Antwortformat: 1 = „trifft überhaupt nicht zu“, 4 = „teils/teils“, 7 = „trifft vollständig zu“","s":"Janke & Glöckner-Rist (2012)"},
{"c":"2 Wohlbefinden & Glück","q":"Warum gilt Wohlbefinden als „holistisches Dachkonzept“?","a":"• Wohlbefinden (well-being) ist das umfassendste der drei Konstrukte\n• Es beschreibt den Zustand des menschlichen Aufblühens (Flourishing)\n• Es integriert hedonische UND eudaimonische Aspekte\n• Bekanntestes Modell: PERMA (Seligman)\n\nMerkmale: multidimensional (mehr als ein Gefühl) und aktiv gestaltbar (jede Säule ist trainierbar).","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Nenne die 6 Dimensionen des psychologischen Wohlbefindens nach Ryff (1989).","a":"1. Selbstakzeptanz\n2. Positive Beziehungen\n3. Autonomie\n4. Umweltgestaltung (Umweltbewältigung)\n5. Lebenssinn / Lebensaufgabe\n6. Persönliches Wachstum\n\nFokus: Eudaimonie (Erfüllung).","s":"Ryff (1989)"},
{"c":"2 Wohlbefinden & Glück","q":"Was ist die HSWBS?","a":"Habituelle Subjektive Wohlbefindensskala (Dalbert, 2002).\n\n• 13 Items, 6-stufiges Antwortformat (1 = „stimmt überhaupt nicht“ bis 6 = „stimmt genau“)\n• Beispielitems: „Ich halte mich für eine glückliche Person“, „Ich fühle mich meist ziemlich fröhlich“, „Ich bin mit meinem Leben zufrieden“\n• Misst habituelles (überdauerndes) Wohlbefinden","s":"Dalbert (2002)"},
{"c":"2 Wohlbefinden & Glück","q":"Welche vier Faktorengruppen beeinflussen subjektives Wohlbefinden?","a":"1) Persönlichkeit / Traits – z. B. Extraversion ↔ positive Emotionen, Neurotizismus ↔ negative Emotionen → individueller „Set-Point“ bzw. „Thermostat“\n2) Lebensereignisse – inkl. hedonistischer Adaption; Set-Point veränderbar (z. B. lange Arbeitslosigkeit, Trauma)\n3) Kultur – Prädiktoren variieren weltweit\n4) Absichtsvolle Handlungen – z. B. Dankbarkeit, Optimismus, Beziehungen, Bewegung, sinnerfüllte Ziele","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Was versteht man unter hedonistischer Adaption?","a":"Positive oder negative Umstände sind oft nur von kurzer Wirkdauer – Menschen gewöhnen sich daran und es entsteht eine „neue Normalität“.\n\nKonsequenz: Äußere Veränderungen (Gehalt, Auto, Umzug) verändern das Wohlbefinden langfristig weniger als erwartet.","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Erkläre die 50-40-10-Formel des Glücks.","a":"• ca. 50 % Set-Point / genetische Veranlagung\n• ca. 40 % absichtsvolle Aktivitäten\n• ca. 10 % Lebensumstände\n\nKernaussage: Wohlbefinden ist NICHT vollständig durch Umstände oder Gene festgelegt – ein erheblicher Teil ist aktiv gestaltbar.","s":"Lyubomirsky, Sheldon & Schkade (2005)"},
{"c":"2 Wohlbefinden & Glück","q":"Welche drei Arten absichtsvoller Aktivitäten unterscheidet Lyubomirsky?","a":"1) Kognitive Aktivitäten: Dankbarkeit praktizieren, Optimismus trainieren, Sorgen vermeiden, soziale Vergleiche reduzieren, positive Erlebnisse auskosten\n2) Verhaltensbezogene Aktivitäten: soziale Beziehungen pflegen, Gutes für andere tun, sich bewegen, sinnerfüllte Ziele verfolgen\n3) Volitionale Aktivitäten: bewusste Entscheidung, sich auf die eigenen Ziele zu konzentrieren und dranzubleiben → Selbstregulation","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Welche begrifflichen Abgrenzungen sind bei „Wohlbefinden“ wichtig?","a":"• Well-being (engl.) ≠ Wohlbefinden (dt.) – englisch ist breiter zu verstehen\n• Happiness (engl.) unterscheidet sich vom dt. „Glück“; happiness wird oft als Synonym für well-being genutzt\n• Wohlbefinden kann als Synonym für Gesundheit oder Lebenszufriedenheit verwendet werden\n• Mood = Laune","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Warum ist die saubere Unterscheidung von Glück, Wohlbefinden und Zufriedenheit für Coaching relevant?","a":"1) Präzise Diagnostik: Was meint jemand mit „Unglücklichsein“? Fehlt es an positiven Momenten, an Sinn oder an Lebenszufriedenheit?\n2) Gezielte Interventionen: je nach „Diagnose“ andere Methode, z. B. Genusstraining vs. Wertearbeit\n3) Klarere Zielsetzung: vage Wünsche („glücklich sein“) in konkrete, messbare Ziele übersetzen (z. B. „mehr bedeutungsvolle Beziehungen pflegen“)","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Welche drei Formen des Glücks unterscheiden Peterson et al. (2006)?","a":"1) Kurzfristiges Vergnügen (z. B. Eis essen)\n2) Eudämonie (z. B. heute etwas auf der Arbeit bewirken)\n3) Engagement/Flow (z. B. in einer Aufgabe aufgehen, Zeit vergessen)","s":"Peterson, Park & Seligman (2006)"},
{"c":"2 Wohlbefinden & Glück","q":"Wie verhalten sich Glück, Wohlbefinden und Lebenszufriedenheit zueinander?","a":"Glück: mehrdeutiger Oberbegriff – momentanes Glücksgefühl ODER langfristiges Lebensglück.\nLeitfrage: „Wie glücklich fühle ich mich gerade/insgesamt?“\n\nWohlbefinden: umfassendes Dachkonzept, integriert hedonische und eudaimonische Aspekte.\nLeitfrage: „Blühe ich in meinem Leben auf?“\n\nLebenszufriedenheit: kognitive, globale Bewertung des eigenen Lebens.\nLeitfrage: „Wie zufrieden bin ich mit meinem Leben als Ganzes?“","s":""},
{"c":"2 Wohlbefinden & Glück","q":"Wie verhalten sich SWB (Diener) und psychologisches Wohlbefinden (Ryff) zueinander?","a":"Beide sind Teilkonzepte des Dachkonzepts „Wohlbefinden/Flourishing“.\n\nSWB nach Diener – zwei Komponenten:\n• affektiv: hohe positive / geringe negative Emotionen (≈ hedonisches Glück)\n• kognitiv: hohe Lebenszufriedenheit\n\nPWB nach Ryff – Fokus auf Eudaimonie: Selbstakzeptanz, persönliches Wachstum, Sinn im Leben, positive Beziehungen, Autonomie, Umweltbewältigung","s":""},

{"c":"3 PERMA & Flow","q":"Wofür stehen die Buchstaben von PERMA-V?","a":"P – Positive Emotionen\nE – Engagement\nR – Relationships (positive Beziehungen)\nM – Meaning (Sinnhaftigkeit)\nA – Accomplishment (Erfolgserleben)\nV – Vitalität\n\nZiel der Positiven Psychologie: zunehmendes Aufblühen (Flourishing) durch Verstärkung dieser Elemente.","s":"Seligman (2011); Zhivotovskaya (2016, 2021)"},
{"c":"3 PERMA & Flow","q":"Welche drei Kriterien muss ein Element erfüllen, um ein PERMA-Element zu sein?","a":"1. Es muss zum Wohlbefinden beitragen.\n2. Seine Erreichung muss um seiner selbst willen verfolgt werden.\n3. Es muss unabhängig von den anderen Elementen und messbar sein.","s":""},
{"c":"3 PERMA & Flow","q":"PERMA: P – Positive Emotionen. Kernidee und Leitfrage?","a":"Kernidee: Freude, Dankbarkeit, Hoffnung, Interesse, Stolz, Gelassenheit bewusst ermöglichen – ohne negative Emotionen zu unterdrücken.\n\nLeitfrage: „Was lässt dich gut fühlen?“","s":""},
{"c":"3 PERMA & Flow","q":"PERMA: E – Engagement. Kernidee und Leitfrage?","a":"Kernidee: Im Tun aufgehen – Flow erleben und eigene Stärken nutzen. Passung zwischen Fähigkeiten und Anforderungen herstellen.\n\nLeitfrage: „Wann bist du im Flow?“","s":""},
{"c":"3 PERMA & Flow","q":"PERMA: R – Relationships. Kernidee und Leitfrage?","a":"Kernidee: Positive Beziehungen leben und Verbundenheit spüren – Unterstützung, Vertrauen, Zugehörigkeit als zentrale Ressource für Wohlbefinden.\n\nLeitfrage: „Wer macht dich glücklich und unterstützt dich?“","s":""},
{"c":"3 PERMA & Flow","q":"PERMA: M – Meaning. Kernidee und Leitfrage?","a":"Kernidee: Sinn erkennen und etwas Größerem dienen – Verbindung zu eigenen Werten und einem größeren Zweck.\n\nLeitfrage: „Welche Werte sind dir wichtig? Was erfüllt dich?“","s":""},
{"c":"3 PERMA & Flow","q":"PERMA: A – Accomplishment. Kernidee und Leitfrage?","a":"Kernidee: Zielerreichung, Kompetenz, Fortschritt und Selbstwirksamkeit – etwas schaffen und Erfolge sichtbar machen.\n\nLeitfrage: „Was sind deine Ziele? Wie erreichst du sie?“","s":""},
{"c":"3 PERMA & Flow","q":"PERMA-V: V – Vitalität. Kernidee?","a":"Kernidee: Energie, körperliche Gesundheit und Lebendigkeit. Wohlbefinden hat auch eine körperlich-energetische Seite.\n\nKonkret: Bewegung, gesunde Ernährung, guter Schlaf, Regeneration.\n\nErweiterung des ursprünglichen PERMA-Modells durch Zhivotovskaya (2016, 2021).","s":""},
{"c":"3 PERMA & Flow","q":"Welche positiven Emotionen nennt Fredrickson?","a":"Freude, Dankbarkeit, Gelassenheit, Liebe, Interesse, Hoffnung, Stolz, Vergnügen, Inspiration, Ehrfurcht.","s":"Fredrickson (2001)"},
{"c":"3 PERMA & Flow","q":"Was besagt die Broaden-and-Build-Theorie?","a":"Positive Emotionen wirken über zwei Mechanismen:\n\nBROADEN (Erweitern): Positive Emotionen erweitern Aufmerksamkeit, Denken und Handlungsspielräume.\n\nBUILD (Aufbauen): Durch das erweiterte Denken und Handeln werden langfristig persönliche Ressourcen aufgebaut.\n\nEmpirischer Nachweis: Positive Emotionen verbessern Leistungsfähigkeit, Ausdauer, Konzentration und Handlungsfähigkeit.","s":"Fredrickson (2001), American Psychologist 56(3)"},
{"c":"3 PERMA & Flow","q":"Was bewirkt „Broaden“ konkret?","a":"Positive Emotionen öffnen den Geist – wir werden:\n• kreativer\n• offener für neue Ideen und Informationen\n• sehen mehr Möglichkeiten → „Think outside the box“\n• knüpfen leichter soziale Kontakte\n• Weitblick statt Tunnelblick\n\nBeispiel: Freude lässt uns spielen wollen → wir lernen neue Fähigkeiten.","s":""},
{"c":"3 PERMA & Flow","q":"Welche vier Ressourcenarten werden durch „Build“ aufgebaut?","a":"1) Intellektuell: Wissen, Problemlösefähigkeiten\n2) Physisch: Koordination, Kraft (durch Spiel/Bewegung)\n3) Sozial: Freundschaften, Netzwerke\n4) Psychologisch: Resilienz, Optimismus, Selbstwirksamkeit","s":""},
{"c":"3 PERMA & Flow","q":"Wie lautet die Aufwärtsspirale der Broaden-and-Build-Theorie?","a":"Positive Emotionen → Broaden → Build → mehr Ressourcen → mehr positive Emotionen → …","s":""},
{"c":"3 PERMA & Flow","q":"Mit welchem Experiment wurde die Broaden-Hypothese geprüft?","a":"Fredrickson & Branigan (2005): Teilnehmende sahen Filme, die (a) Belustigung, (b) Zufriedenheit, (c) Neutralität, (d) Wut oder (e) Angst hervorriefen.\n\nOperationalisierung:\n• Aufmerksamkeit über Blickbewegung\n• Denk- und Handlungsbreite über den „20-Statement-Test“\n\nErgebnis: Belustigung und Zufriedenheit erhöhten im Vergleich zu neutral die Aufmerksamkeit; Wut und Angst verringerten die Denk- und Handlungsbreite.","s":"Fredrickson & Branigan (2005)"},
{"c":"3 PERMA & Flow","q":"Warum ist Broaden-and-Build wichtig für Coaching, Beratung und Change?","a":"Positive Emotionen erweitern den Möglichkeitsraum:\n• Menschen kommen aus dem Tunnelblick heraus\n• erkennen eigene Ressourcen\n• entwickeln alternative Handlungsoptionen\n• bauen langfristig Resilienz, Optimismus und Selbstwirksamkeit auf\n\n→ Erst positive Emotionen schaffen die Voraussetzung für Lernen und Veränderung.","s":""},
{"c":"3 PERMA & Flow","q":"Definiere Flow.","a":"Flow beschreibt einen Zustand des vollkommenen und reflexionsfreien Vertiefens und Aufgehens in einer Tätigkeit, die persönlich herausfordernd ist und dennoch optimal gelingt, d. h. glatt und fließend abläuft.","s":"Csikszentmihályi (1975, 1992, 2002)"},
{"c":"3 PERMA & Flow","q":"Wie entsteht Flow?","a":"In der Balance zwischen\n• persönlicher Fähigkeit und Fertigkeit (skill) und\n• Anforderung der Situation bzw. Schwierigkeit der Aufgabe (challenge)\n\n→ Herausforderung zu niedrig = Langeweile\n→ Herausforderung zu hoch = Überforderung/Angst\n→ Optimale Passung = Flow\n\nJede Tätigkeit bietet grundsätzlich die Möglichkeit für Flow (Blickhan, 2018).","s":"Csikszentmihályi (2002, 2018)"},
{"c":"3 PERMA & Flow","q":"Welche vier Wirkebenen von Flow werden unterschieden?","a":"• affektiv: positive Gefühle\n• kognitiv: Steigerung von Aufmerksamkeitsspanne und Konzentration\n• konativ: Korrelation mit Leistung und Erfolg (Beruf, Lernen)\n• physiologisch: Cortisolwerte moderat erhöht","s":""},
{"c":"3 PERMA & Flow","q":"Wie ist die Flow-Kurzskala (FKS) aufgebaut?","a":"Rheinberg, Vollmeyer & Engeser (2019), 7-stufige Likert-Skala („trifft nicht zu“ bis „trifft zu“):\n\n• Items 1–10: Flow\n• Items 11–13: Besorgnis\n• Items 14–16: Verhältnis zwischen Flow und Besorgnis (Schwierigkeit, eigene Fähigkeiten, Passung der Anforderungen)","s":"Rheinberg et al. (2019)"},
{"c":"3 PERMA & Flow","q":"Nenne typische Items der Flow-Kurzskala.","a":"• Ich fühle mich optimal beansprucht.\n• Meine Gedanken bzw. Aktivitäten laufen flüssig und glatt.\n• Ich merke gar nicht, wie die Zeit vergeht.\n• Ich habe keine Mühe, mich zu konzentrieren.\n• Mein Kopf ist völlig klar.\n• Ich bin ganz vertieft in das, was ich gerade mache.\n• Die richtigen Gedanken/Bewegungen kommen wie von selbst.\n• Ich habe das Gefühl, den Ablauf unter Kontrolle zu haben.\n• Ich bin völlig selbstvergessen.\n\nBesorgnis-Items: „Es steht etwas für mich Wichtiges auf dem Spiel“, „Ich darf jetzt keine Fehler machen“, „Ich mache mir Sorgen über einen Misserfolg“.","s":""},
{"c":"3 PERMA & Flow","q":"Wo wird Flow in PERMA eingeordnet?","a":"Bei E – Engagement.\n\nFlow ist der Kern von Engagement: im Tun aufgehen, intrinsisch motiviert, konzentriert und involviert sein.","s":""},
{"c":"3 PERMA & Flow","q":"Definiere Charakterstärken.","a":"• Charakterstärken und Tugenden sind Kerncharakteristiken des menschlichen Funktionierens.\n• Charakterstärken sind psychologische Merkmale, die die Tugenden definieren.\n• Sie bilden einen Teil der Persönlichkeit ab.\n• Annahme: über Situationen und Zeit hinweg relativ stabil – können sich aber als Resultat von Lebenserfahrungen verändern bzw. weiterentwickeln.","s":"Seligman & Peterson (2004)"},
{"c":"3 PERMA & Flow","q":"Wie funktioniert der Stärken-Check in vier Schritten?","a":"1. „Es ist etwas, das aus mir herausdrängt und mir Energie gibt, wenn ich es ausleben kann. Das bin wirklich ich, wenn ich das mache!“\n2. „Es fehlt mir etwas, wenn ich es nicht ausleben kann.“\n3. „Es kostet mich Energie, wenn ich es zurückhalten muss, weil es z. B. nicht zur Situation passt.“\n4. „Es kommt auch vor, dass ich mehr davon mache, als gut ist.“","s":"Ebner (2024)"},
{"c":"3 PERMA & Flow","q":"Mit welchen Fragen können Stärken in der Beratung identifiziert werden?","a":"• „Wann fühlen Sie sich energiegeladen/authentisch?“\n• „Was fällt Ihnen leicht?“\n• „Wofür bekommen Sie Komplimente?“\n• VIA-Test als Hausaufgabe vorschlagen","s":""},
{"c":"3 PERMA & Flow","q":"Mit welchen Fragen können Stärken in der Beratung eingesetzt werden?","a":"• „Wie könnte Ihnen Ihre Stärke [z. B. Kreativität oder Humor] helfen, dieses Ziel zu erreichen?“\n• „In welcher vergangenen Situation hat Ihnen Ihre [z. B. Ausdauer oder Mut] schon einmal geholfen?“\n\nGrundannahme: Alle haben Stärken – sie sind individuelle Energiequellen, wenn sie gelebt werden.","s":""},
{"c":"3 PERMA & Flow","q":"Was ist die VIA-Klassifikation?","a":"Die Klassifikation von Charakterstärken nach Peterson & Seligman:\n• 6 Tugenden\n• 24 Charakterstärken\n\nTestmöglichkeit (im Skript genannt): persoenlichkeitsstaerken.ch\n\nKritikpunkt: Die feste Zahl von 6 Tugenden und 24 Stärken wird als „dogmatisch-ganzheitliche Denkformel“ kritisiert.","s":""},
{"c":"3 PERMA & Flow","q":"Wie lautet der Lösungs- und Möglichkeits-Talk?","a":"STATT „Was ist das Problem?“ → „Was wünschen Sie sich stattdessen?“\n\nSTATT „Warum klappt das nicht?“ → „Was funktioniert schon gut, auch wenn es nur ein bisschen ist?“ (Ausnahmen finden)\n\nSTATT „Was sind die Hindernisse?“ → „Welche Ressourcen (innere/äußere) haben Sie, um die Herausforderung zu meistern?“","s":""},
{"c":"3 PERMA & Flow","q":"Wie lautet die angepasste Wunderfrage?","a":"„Stellen Sie sich vor, über Nacht geschieht ein Wunder und Ihr Problem ist gelöst. Was wäre morgen früh das Allererste, woran Sie merken, dass das Wunder geschehen ist?“","s":""},
{"c":"3 PERMA & Flow","q":"Klausurhinweis: Was ist Stärkenorientierung NICHT?","a":"Stärkenorientierung ist kein Schönreden und kein Ignorieren von Problemen.\n\nEs geht darum, Ressourcen sichtbar zu machen und für realistische Zielerreichung nutzbar zu machen.","s":""},

{"c":"4 Mentale Gesundheit","q":"Was bedeutet ein dimensionales Verständnis von mentaler Gesundheit?","a":"Gesundheit ist kein „entweder … oder“.\n\nMenschen können gleichzeitig mehr oder weniger krank UND mehr oder weniger gesund sein. Gesundheit und Krankheit liegen auf einem Kontinuum.\n\nDaraus folgt: Wer keine diagnostizierte psychische Störung hat, ist nicht automatisch mental gesund.","s":""},
{"c":"4 Mentale Gesundheit","q":"Was ist der Unterschied zwischen Pathogenese und Salutogenese?","a":"Pathogenese fragt: Was macht krank?\nSalutogenese fragt: Was hält gesund?","s":"Antonovsky"},
{"c":"4 Mentale Gesundheit","q":"Stelle Pathogenese und Salutogenese in sechs Punkten gegenüber.","a":"PATHOGENESE | SALUTOGENESE\n1) Entstehung von Krankheit | Entstehung von Gesundheit\n2) Dichotomie (Krankheit/Gesundheit schließen sich aus) | Gesundheits-Krankheits-Kontinuum\n3) Fokus auf einzelne Symptome und Beschwerden | Ganzheitliche Betrachtung inkl. Lebenssituation und -geschichte\n4) Blick auf Risikofaktoren | Blick auf Bewältigungsressourcen und Kohärenzsinn\n5) Intervention: Einsatz von Heilmitteln | Intervention: aktive Anpassung, Ressourcenentwicklung, Risikoreduktion\n6) Bio-medizinisches Modell | Biopsychosoziales Modell","s":""},
{"c":"4 Mentale Gesundheit","q":"Definiere den Kohärenzsinn.","a":"Der Kohärenzsinn ist eine globale Orientierung, die das Maß ausdrückt, in dem man ein durchdringendes, andauerndes, aber dynamisches Gefühl des Vertrauens hat, dass die eigene interne und externe Umwelt vorhersagbar ist und dass es eine hohe Wahrscheinlichkeit gibt, dass sich die Dinge so entwickeln werden, wie vernünftigerweise erwartet werden kann.\n\nHohe Kohärenz führt dazu, dass Ressourcen im Sinne der mentalen Gesundheit aktiviert werden.","s":"Antonovsky (1997), S. 16"},
{"c":"4 Mentale Gesundheit","q":"Nenne die drei Komponenten des Kohärenzsinns.","a":"1. Verstehbarkeit\n2. Handhabbarkeit\n3. Sinnhaftigkeit","s":""},
{"c":"4 Mentale Gesundheit","q":"Was beschreibt das Doppel-Kontinuum der mentalen Gesundheit nach Keyes (2002)?","a":"Zwei unabhängige Dimensionen:\n• Achse 1: Vorliegen/Ausmaß einer psychischen Erkrankung\n• Achse 2: Ausmaß mentalen Wohlbefindens\n\nDaraus ergeben sich vier Zustände:\n• Flourishing / Aufblühen (hohes Wohlbefinden, keine Erkrankung)\n• Languishing / Verkümmern (niedriges Wohlbefinden, keine Erkrankung)\n• Kämpfend (Erkrankung, aber hohes Wohlbefinden)\n• Strauchelnd (Erkrankung und niedriges Wohlbefinden)","s":"Keyes (2002)"},
{"c":"4 Mentale Gesundheit","q":"Was bedeutet Languishing – und warum ist es klausurrelevant?","a":"Languishing = Verkümmern: niedriges mentales Wohlbefinden OHNE zwingend diagnostizierte psychische Erkrankung.\n\nRelevanz: Zeigt, dass die Abwesenheit von Krankheit nicht ausreicht. Coaching setzt genau hier an – Bewegung von Languishing in Richtung Flourishing.","s":""},
{"c":"4 Mentale Gesundheit","q":"Was heißt „Coaches sind Architekten des Aufblühens“?","a":"• Coaches sind nicht „nur“ Reparateure von Defiziten\n• Fokus auf die vertikale Achse: Menschen von Languishing zu Flourishing begleiten\n• Ressourcen von „kämpfenden“ Klient:innen erkennen und würdigen\n• Bei klinischen Themen: Kooperation bzw. Kombination mit Therapeut:innen","s":""},
{"c":"4 Mentale Gesundheit","q":"Wie hängen Salutogenese, mentale Gesundheit, Wohlbefinden und Resilienz zusammen?","a":"• Salutogenese = übergeordnetes Paradigma/Philosophie mit Ressourcenfokus\n• Mentale Gesundheit (Keyes) = differenziertes Diagnosemodell, um den Zustand einer Person zu verorten\n• Wohlbefinden/Flourishing = Ziel bzw. Optimalzustand innerhalb dieses Modells\n• Resilienz = dynamischer Prozess bzw. Motor, der Bewegung in dem Modell ermöglicht: schützt vor dem Abrutschen in Krankheit (horizontal) und treibt Wachstum Richtung Flourishing an (vertikal)","s":""},

{"c":"5 Resilienz","q":"Definiere Resilienz (wissenschaftlich).","a":"„Resilienz ist der Prozess der guten Anpassung angesichts von Widrigkeiten, Traumata, Tragödien, Bedrohungen oder signifikanten Stressquellen.“ (in Anlehnung an die APA)\n\n→ nicht statisch, sondern flexibel\n→ dynamischer Anpassungsprozess\n→ es gibt „Widrigkeiten“ – ohne Belastung keine Resilienz\n→ kritischer Diskurs; es gibt NICHT die eine einheitliche Definition","s":"APA; Wessa (2025)"},
{"c":"5 Resilienz","q":"Woher stammt der Begriff Resilienz und was bedeutet er in Physik und Psychologie?","a":"• Lat.: „zurückspringen“, „abprallen“\n• Physik: in die ursprüngliche Form zurückfinden\n• Psychologie: Widerstandsfähigkeit; Aushalten und Bewältigen von Krisen; positiver Umgang mit Stress und kritischen Ereignissen","s":""},
{"c":"5 Resilienz","q":"Mythos 1: „Resilienz bedeutet, nach einer Krise schnell wieder der/die Alte zu sein.“","a":"FALSCH.\n\nResilienz bedeutet nicht unbedingt die Rückkehr zum exakten Ausgangszustand. Oft entsteht posttraumatisches Wachstum: Menschen entwickeln neue Prioritäten, Stärken oder eine tiefere Wertschätzung für das Leben.\n\n→ Nicht „die Alten“, sondern eine veränderte, oft reifere Version ihrer selbst.","s":""},
{"c":"5 Resilienz","q":"Mythos 2: „Resilienz ist dasselbe wie Härte oder ein dickes Fell.“","a":"FALSCH.\n\nHärte impliziert oft Unflexibilität und das Abblocken von Emotionen.\n\nResilienz erfordert psychologische Flexibilität – die Fähigkeit, sich anzupassen, Emotionen zu akzeptieren (statt sie zu unterdrücken) und aus Erfahrungen zu lernen.","s":""},
{"c":"5 Resilienz","q":"Mythos 3: „Resilienz braucht man nur in großen Lebenskrisen.“","a":"FALSCH.\n\nResilienz ist auch die Fähigkeit, mit alltäglichen Stressoren, kleinen Rückschlägen und chronischem Druck umzugehen.\n\nDiese „Mikro-Resilienz“ ist entscheidend, um das tägliche Wohlbefinden aufrechtzuerhalten.","s":""},
{"c":"5 Resilienz","q":"Mythos 4: „Wer resilient ist, braucht keine Hilfe von anderen.“","a":"FALSCH – einer der größten Mythen.\n\nSoziale Unterstützung und die Fähigkeit, um Hilfe zu bitten, sind zentrale Säulen der Resilienz. Resiliente Menschen sind oft besonders gut darin, ihre sozialen Netzwerke zu aktivieren und zu nutzen.\n\nResilienz ist keine rein individualistische „Einzelkämpfer“-Leistung.","s":""},
{"c":"5 Resilienz","q":"Mythos 5: „Optimismus ist der wichtigste Faktor für Resilienz.“","a":"FALSCH.\n\nOptimismus ist wichtig, aber nicht allein entscheidend – blinder Optimismus kann sogar schaden.\n\nWichtiger ist realistischer Optimismus, gepaart mit Akzeptanz, Problemlösekompetenz und der Fähigkeit, soziale Unterstützung zu mobilisieren. Ein resilienter Mensch ist Optimist, Realist UND Macher.","s":""},
{"c":"5 Resilienz","q":"Was war die Kauai-Studie und was hat sie gezeigt?","a":"Pionierarbeit, die den Begriff Resilienz populär machte (Werner & Smith, 1982).\n\n• Über 30 Jahre wurde ein Geburtsjahrgang von 698 Kindern auf Kauai/Hawaii begleitet\n• Viele litten unter erheblichen Risikofaktoren (Armut, perinatale Komplikationen, psychische Störungen der Eltern)\n• Ergebnis: ca. ein Drittel entwickelte sich zu fürsorglichen, kompetenten und zuversichtlichen Erwachsenen\n• Fokusverschiebung von Risiko- zu Schutzfaktoren (z. B. enge Bindung zu mindestens einer Bezugsperson, positives soziales Umfeld)","s":"Werner & Smith (1982)"},
{"c":"5 Resilienz","q":"Welchen Beitrag leistete Michael Rutter zur Resilienzforschung?","a":"Rutter konzeptualisierte Resilienz als dynamischen, interaktiven Prozess.\n\nSeine Forschung zeigte: Es ist die Interaktion zwischen Individuum und Umwelt, die Resilienz hervorbringt.\n\nFragefokus: „Welche Prozesse führen zu resilienten Ergebnissen?“","s":"Rutter (1987)"},
{"c":"5 Resilienz","q":"Was bedeutet „Ordinary Magic“ nach Ann Masten?","a":"Resilienz entsteht NICHT aus seltenen, übermenschlichen oder außergewöhnlichen Eigenschaften.\n\nSie ist das Ergebnis der normalen Funktionsweise fundamentaler menschlicher adaptiver Systeme:\n• sicheres Bindungssystem\n• kognitive Problemlösefähigkeiten\n• Systeme zur Selbstregulation von Emotionen und Aufmerksamkeit\n• Erleben von Selbstwirksamkeit\n• funktionierende soziale Systeme (Familie, Schule, Gemeinschaft)","s":"Masten (2001)"},
{"c":"5 Resilienz","q":"Nenne die 7 Säulen der Resilienz.","a":"1. Akzeptanz\n2. Optimismus\n3. Lösungsorientierung\n4. Verlassen der Opferrolle (Selbstwirksamkeit)\n5. Verantwortung übernehmen\n6. Netzwerkorientierung (Beziehungsgestaltung)\n7. Zukunftsplanung","s":"Reivich & Shatté (2002); Rampe (2005)"},
{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet Akzeptanz?","a":"Annehmen, was nicht veränderbar ist, und Energie auf das Machbare lenken.\n\nEvidenz: Psychologische Flexibilität – schwierige Gefühle akzeptieren und werteorientiert handeln – ist ein Kernmechanismus psychischer Gesundheit (ACT-Forschung, Hayes 2019).","s":""},
{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet Optimismus?","a":"Glaube an eine positive Zukunft und die eigene Gestaltungsfähigkeit.\n\nEvidenz: Optimismus korreliert signifikant mit besseren Bewältigungsstrategien und geringeren Entzündungswerten im Körper bei Stress (Scheier & Carver, 2018).","s":""},
{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet Lösungsorientierung?","a":"Fokus auf Lösungen statt (ausschließlich) auf Probleme.\n\nEvidenz: Eine hohe Selbstwirksamkeitserwartung ist einer der stärksten Prädiktoren für Zielerreichung und Ausdauer bei Rückschlägen (Talsma et al., 2018).","s":""},
{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet „Verlassen der Opferrolle“ / Selbstwirksamkeit?","a":"Überzeugung, Einfluss auf das eigene Leben nehmen zu können.\n\nEvidenz: Ein internaler Kontrollüberzeugungs-Locus („Ich habe Einfluss“) ist konsistent mit höherer Lebenszufriedenheit und proaktiverem Gesundheitsverhalten assoziiert als ein externaler Locus („Andere/das Schicksal bestimmen“) (Nowicki, 2017).","s":""},
{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet Verantwortung übernehmen?","a":"Verantwortung für das eigene Handeln und Fühlen übernehmen.\n\nVerbunden mit Coveys Unterscheidung von Betroffenheitsbereich (Circle of Concern) und Einflussbereich (Circle of Influence).","s":""},
{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet Netzwerkorientierung?","a":"Aktives Pflegen und Nutzen sozialer Unterstützung (Beziehungsgestaltung).\n\nEvidenz: Soziale Unterstützung wirkt als „Stress-Puffer“. Neurobiologische Studien zeigen, dass soziale Verbundenheit die Ausschüttung von Oxytocin fördert, was die physiologische Stressreaktion (Cortisol) dämpft (Inagaki & Eisenberger, 2016).","s":""},
