{"c":"5 Resilienz","q":"7 Säulen – Was bedeutet Zukunftsplanung?","a":"Sich realistische und sinnstiftende Ziele setzen.\n\nEvidenz: Die Fähigkeit zur „prospektiven Kognition“ – dem mentalen Simulieren zukünftiger Ereignisse und Ziele – ist entscheidend für motiviertes Handeln und die Regulation von Emotionen in der Gegenwart (Seligman et al., 2013, Homo Prospectus).","s":""},
{"c":"5 Resilienz","q":"Was unterscheidet Betroffenheitsbereich und Einflussbereich (Covey)?","a":"Betroffenheitsbereich („Circle of Concern“): alles, was mich beschäftigt und betrifft, worauf ich aber keinen Einfluss habe → Akzeptanz\n\nEinflussbereich („Circle of Influence“): das, worauf ich tatsächlich einwirken kann → Gestaltungsprinzip\n\nInnerster Kern = Kontrolle: das eigene Verhalten und die eigenen Gedanken.","s":"Covey (1989, 2004)"},
{"c":"5 Resilienz","q":"Was ist das Master Resilience Training (MRT)?","a":"Kern des „Comprehensive Soldier Fitness“ (CSF)-Programms, das Seligman für die U.S. Army entwickelt hat.\n\nZiel: Behandlung von PTBS UND präventive Stärkung der psychologischen Fitness, um auf Widrigkeiten vorzubereiten.\n\nKernbotschaft: Resilienz ist trainierbar – als kognitive und emotionale Fähigkeit.","s":"Seligman (2011), Flourish, Kap. 5"},
{"c":"5 Resilienz","q":"Nenne die 6 Kernkompetenzen des Master Resilience Trainings.","a":"1. Selbst-Bewusstheit (Self-Awareness): eigene Gedanken, Emotionen und Reaktionen in Stresssituationen erkennen\n2. Selbst-Regulation (Self-Regulation): Emotionen und Impulse steuern, z. B. durch Atemtechniken\n3. Optimismus: Anwendung des ABCDE-Modells zur Umstrukturierung pessimistischer Gedanken\n4. Mentale Agilität: Probleme aus verschiedenen Perspektiven betrachten und „Denkfallen“ erkennen\n5. Charakterstärken: eigene VIA-Signaturstärken kennen und bewusst zur Bewältigung einsetzen\n6. Verbindung (Connection): starke soziale Beziehungen als Schutzfaktor aufbauen und pflegen","s":""},
{"c":"5 Resilienz","q":"Wofür stehen die Buchstaben des ABCDE-Modells?","a":"A – Adversity (Auslöser): Was ist objektiv passiert?\nB – Beliefs (Bewertungen): Welche Gedanken gingen mir sofort durch den Kopf?\nC – Consequences (Konsequenzen): Was war die Folge dieser Gedanken – Gefühle und Verhalten?\nD – Disputation (Diskussion): Die Gedanken aus B in Frage stellen.\nE – Energization (Neue Energie): Was ist das Ergebnis der Diskussion?","s":""},
{"c":"5 Resilienz","q":"ABCDE: Welche vier Strategien gehören zum Schritt D – Disputation?","a":"1) Evidenz: Welche Beweise gibt es wirklich für diesen Gedanken? Welche dagegen?\n2) Alternativen: Gibt es eine andere, wohlwollendere oder realistischere Erklärung?\n3) Nützlichkeit: Hilft mir dieser Gedanke, mein Ziel zu erreichen, oder blockiert er mich?\n4) Worst-Case (De-Katastrophisierung): Selbst wenn der Gedanke wahr wäre – was wäre das Schlimmste? Könnte ich damit umgehen? Wie?","s":""},
{"c":"5 Resilienz","q":"ABCDE: Was passiert im Schritt E – Energization?","a":"Was ist das Ergebnis der Diskussion?\n\n• Gefühle: Wie fühle ich mich jetzt, nachdem ich meine Gedanken hinterfragt habe?\n• Verhalten: Welcher konstruktive nächste Schritt ergibt sich daraus? Was tue ich jetzt?","s":""},
{"c":"5 Resilienz","q":"Kritik an Resilienz – Kritikpunkt 1: Individualisierung und Victim Blaming.","a":"Der Fokus auf individuelle Resilienz kann von systemischen Problemen ablenken.\n\nStatt ein toxisches Arbeitsumfeld zu verändern, wird vom Mitarbeitenden verlangt, „resilienter“ zu werden. Die Verantwortung wird vom System auf das Individuum verschoben.","s":"Welsh (2021)"},
{"c":"5 Resilienz","q":"Kritik an Resilienz – Kritikpunkt 2: Druck zur Unverwundbarkeit und toxische Positivität.","a":"Das Ideal des „unverwundbaren“ resilienten Menschen kann dazu führen, dass legitime negative Emotionen wie Trauer, Wut oder Angst unterdrückt werden.\n\nResilienz wird mit dem Fehlen emotionaler Reaktion verwechselt. Echte Verarbeitung und posttraumatisches Wachstum werden so verhindert.","s":""},
{"c":"5 Resilienz","q":"Kritik an Resilienz – Kritikpunkt 3: Kulturelle und kontextuelle Blindheit.","a":"Viele Resilienzmodelle (z. B. die 7 Säulen) sind westlich-individualistisch geprägt – etwa durch den Fokus auf Selbstwirksamkeit und Optimismus.\n\nIn kollektivistischen Kulturen könnten soziale Harmonie, das Akzeptieren des Schicksals oder die Stärke der Gemeinschaft zentralere Resilienzfaktoren sein.","s":""},
{"c":"5 Resilienz","q":"Welche drei Forschungslücken/Limitationen gibt es bei Resilienz?","a":"1) Geringe Effektstärken: Die meisten identifizierten Resilienzfaktoren weisen für sich genommen nur sehr kleine bis kleine Effekte auf.\n2) Mangel an Längsschnittdaten: Viele Studien haben keine Daten aus der Zeit VOR dem belastenden Ereignis – das erschwert die Identifikation tatsächlicher Schutzfaktoren.\n3) Fokus auf Individuen: Interventionsprogramme konzentrieren sich stark auf das Individuum; soziale und gesellschaftliche Mechanismen sind unzureichend untersucht.","s":""},
{"c":"5 Resilienz","q":"Fasse Resilienz in drei Kernsätzen zusammen.","a":"1) Resilienz ist ein trainierbarer Prozess, keine angeborene Eigenschaft.\n2) Sie ist der Motor für mentale Gesundheit und hilft, in Richtung Flourishing zu wachsen.\n3) Als Coaches können wir Klient:innen helfen, ihre persönliche Resilienz-Landschaft zu verstehen und gezielt zu kultivieren.\n\n„Zwischen Reiz und Reaktion liegt ein Raum. In diesem Raum liegt unsere Macht zur Wahl unserer Reaktion. In unserer Reaktion liegen unsere Entwicklung und unsere Freiheit.“ – Viktor E. Frankl","s":""},
{"c":"5 Resilienz","q":"Nenne aktuelle Forschungsbefunde zu Resilienz.","a":"• Hu et al. (2015, Meta-Analyse): Hohe Resilienz ↔ niedrige depressive Verstimmung; hohe Resilienz ↔ hohe Lebenszufriedenheit. Korrelationen stärker bei Frauen.\n• Stokburger-Sauer et al. (2023): Hohe Resilienz ↔ bessere Bewältigung von Life-Events (z. B. COVID-19) und gesündere Coping-Mechanismen.\n• Schäfer et al. (2024): Resiliente Reaktion wird durch individuelle, soziale UND gesellschaftliche Ebenen bestimmt.\n• Troy et al. (2023): Kritische Reflexion und Konzeptualisierung von Resilienz als Affektregulations-Framework.","s":""},

{"c":"6 Positive Leadership","q":"Worauf konzentriert sich Führung häufig – und wie lautet die Leitfrage des Positive-Leadership-Ansatzes?","a":"Ausgangslage klassischer Führung:\n• Problemlösung, Fehleranalyse, „Feuer löschen“\n• Schließen von Leistungs- und Kompetenzlücken (Defizitorientierung)\n• Umgang mit Konflikten und Stressfaktoren\n• Zielerreichung durch Kontrolle und Anweisung\n\nLeitfrage Positive Leadership:\n„Was wäre, wenn wir uns darauf konzentrieren, was Organisationen und Menschen Leben, Energie und Leistungsfähigkeit verleiht?“","s":""},
{"c":"6 Positive Leadership","q":"Welche zwei theoretischen Ansätze des Positive Leadership behandelt das Skript?","a":"1) Positive Leadership und Positive Organizational Scholarship nach Cameron\n2) PERMA-Lead® nach Ebner","s":""},
{"c":"6 Positive Leadership","q":"Was ist das Ziel von Positive Leadership nach Cameron?","a":"„Positiv deviante“ Leistungen ermöglichen – also Ergebnisse, die weit über den Durchschnitt hinausragen.\n\nEs geht NICHT darum, Probleme zu ignorieren, sondern die Bedingungen für außergewöhnliches Gedeihen (Flourishing) zu schaffen.","s":"Cameron (2012)"},
{"c":"6 Positive Leadership","q":"Nenne die vier Strategien von Positive Leadership nach Cameron.","a":"1. Positive Climate\n2. Positive Relationships\n3. Positive Communication\n4. Positive Meaning","s":"Cameron (2012)"},
{"c":"6 Positive Leadership","q":"Cameron – Was bedeutet Positive Climate?","a":"• Fokus auf Empathie und Dankbarkeit\n• Schaffung von psychologischer Sicherheit, in der Fehler als Lernchancen gesehen werden\n\nKontrast: Statt „Wer ist für diesen Fehler verantwortlich?“ → „Was können wir gemeinsam aus diesem Fehler lernen?“","s":""},
{"c":"6 Positive Leadership","q":"Cameron – Was bedeutet Positive Relationships?","a":"• Interaktionen, die Energie geben statt entziehen\n• Aufbau von Vertrauen und gegenseitigem Respekt\n• Stärken im anderen erkennen und benennen\n\nKontrast: Statt „Lassen Sie uns direkt zur Sache kommen.“ → „Wie geht es Ihnen? Was hat Sie diese Woche beschäftigt?“","s":""},
{"c":"6 Positive Leadership","q":"Cameron – Was bedeutet Positive Communication?","a":"• Einsatz bekräftigender und unterstützender Sprache\n• Aufrechterhaltung einer hohen Ratio von positiven zu negativen Aussagen (vgl. Losada & Heaphy, 2004)\n\nKontrast: Statt Fokus auf das jährliche Kritikgespräch → regelmäßiges, spezifisches Feedback zu Stärken und Erfolgen im Alltag.","s":"Losada & Heaphy (2004)"},
{"c":"6 Positive Leadership","q":"Cameron – Was bedeutet Positive Meaning?","a":"• Die Arbeit mit den persönlichen Werten der Mitarbeitenden verbinden\n• Den Beitrag der täglichen Aufgaben zum „großen Ganzen“ (Zweck, Vision) aufzeigen\n\nKontrast: Statt „Unsere Abteilung muss X % Umsatzsteigerung erreichen.“ → „Durch unsere Arbeit helfen wir unseren Kunden, Y zu erreichen. Jeder Beitrag zählt.“","s":""},
{"c":"6 Positive Leadership","q":"Welche „harten Fakten“ liefert die Cameron-Studie (2011)?","a":"• 40 Geschäftseinheiten eines großen Finanzdienstleistungsunternehmens wurden untersucht\n• Strategische Ausrichtung: positive organisationale Praktiken (Mitgefühl, Dankbarkeit, Integrität, Vertrauen) aktiv in die Unternehmenskultur integrieren\n• Ergebnis: Einheiten, die diese Praktiken am stärksten verbesserten, erzielten statistisch signifikant bessere Rentabilitätswerte","s":"Cameron, Mora, Leutscher & Calarco (2011)"},
{"c":"6 Positive Leadership","q":"Was ist die Grundidee von PERMA-Lead® nach Ebner?","a":"PERMA-Lead überträgt das PERMA-Modell auf Führung – zur „Stärkung der Stärken der Beschäftigten“.\n\nFührung soll ermöglichen:\n• positive Emotionen erleben\n• Engagement und Flow fördern\n• positive Beziehungen stärken\n• Sinn vermitteln\n• Erreichtes sichtbar machen","s":"Ebner (2017, 2024)"},
{"c":"6 Positive Leadership","q":"PERMA-Lead: Positive Emotionen – Kerngedanke und Bedeutung für Führung?","a":"Kerngedanke: Bewusstes Fördern und Erleben positiver Gefühle (Freude, Dankbarkeit, Hoffnung, Interesse, Stolz, Gelassenheit) im Arbeitskontext. Es geht nicht darum, negative Emotionen zu unterdrücken, sondern den Raum für positive zu erweitern.\n\nBedeutung:\n• steigert Kreativität und Offenheit für Neues\n• verbessert Problemlösefähigkeiten\n• baut psychologische Ressourcen und Resilienz auf\n• fördert positives Arbeitsklima und soziale Bindungen\n• erhöht Motivation und Engagement","s":""},
{"c":"6 Positive Leadership","q":"PERMA-Lead: Engagement – Kerngedanke und Bedeutung für Führung?","a":"Kerngedanke: Das Gefühl, in der Tätigkeit aufzugehen, konzentriert, involviert und intrinsisch motiviert zu sein („Flow“). Passung zwischen Herausforderungen der Aufgabe und eigenen Fähigkeiten/Stärken.\n\nBedeutung:\n• steigert Leistung und Produktivität\n• erhöht Arbeitszufriedenheit und Bindung ans Unternehmen\n• fördert Lernen und Kompetenzentwicklung\n• stärkt das Gefühl der Selbstwirksamkeit","s":""},
{"c":"6 Positive Leadership","q":"PERMA-Lead: Relationships – Kerngedanke und Bedeutung für Führung?","a":"Kerngedanke: Erleben von Zugehörigkeit, gegenseitiger Unterstützung, Vertrauen und Wertschätzung; Gefühl, Teil einer Gemeinschaft zu sein, auf die man sich verlassen kann.\n\nBedeutung:\n• essentiell für Wohlbefinden und psychische Gesundheit\n• baut Vertrauen und psychologische Sicherheit auf – Basis für offene Kommunikation\n• fördert Teamzusammenhalt und effektive Zusammenarbeit\n• dient als Puffer bei Stress (soziale Unterstützung)\n• erhöht Bindung an Team und Unternehmen","s":""},
{"c":"6 Positive Leadership","q":"PERMA-Lead: Meaning – Kerngedanke und Bedeutung für Führung?","a":"Kerngedanke: Das Gefühl, dass die eigene Arbeit bedeutsam ist und zu etwas beiträgt, das über einen selbst hinausgeht; Verbindung der Tätigkeit mit persönlichen Werten oder einem größeren Zweck (Vision, Mission).\n\nBedeutung:\n• stärkster Treiber für langfristige Motivation und Engagement\n• erhöht Arbeitszufriedenheit\n• steigert Resilienz gegenüber Schwierigkeiten und Rückschlägen\n• fördert das Gefühl, einen positiven Beitrag zu leisten\n• hilft bei der Priorisierung von Aufgaben","s":""},
{"c":"6 Positive Leadership","q":"PERMA-Lead: Achievement – Kerngedanke und Bedeutung für Führung?","a":"Kerngedanke: Gefühl von Kompetenz und Selbstwirksamkeit durch Zielerreichung, Meistern von Herausforderungen und Wahrnehmen von Fortschritt.\n\nBedeutung:\n• stärkt Selbstvertrauen und Motivation\n• fördert das Gefühl, wirksam zu sein\n• gibt Orientierung und Struktur\n• macht Fortschritt sichtbar und messbar\n• trägt maßgeblich zur Arbeitszufriedenheit bei","s":""},
{"c":"6 Positive Leadership","q":"Vergleiche Cameron und PERMA-Lead: Fokus, Anwendung, Gemeinsamkeiten.","a":"FOKUS\nCameron: stärker auf den organisationalen Kontext und die Kultur, die eine Führungskraft schafft (Klima, Kommunikation)\nPERMA-Lead: stärker auf die individuellen psychologischen Bedürfnisse und Wohlbefindens-Faktoren der Mitarbeitenden\n\nANWENDUNG\nCameron: gibt strategische Richtungen für die Kulturentwicklung vor\nPERMA-Lead: bietet ein konkretes Framework für die tägliche Führungsarbeit und Mitarbeitergespräche\n\nGEMEINSAMKEITEN\n• beide ressourcen- und stärkenorientiert\n• beide betonen Sinn (Meaning) und positive Beziehungen (Relationships)\n• beide zielen auf eine Win-Win-Situation: Wohlbefinden UND Leistung","s":""},
{"c":"6 Positive Leadership","q":"Welche drei Testverfahren gehören zur PERMA-Lead-Diagnostik?","a":"1. Profiler\n2. Leadership- und Managementkompetenzen\n3. Führungs- und Organisationskulturanalyse","s":"perma-lead.com/testverfahren"},
{"c":"6 Positive Leadership","q":"Was misst und zeigt der PERMA-Lead-Profiler?","a":"• Befragung der Führungskraft zu ihrem Positive-Leadership-Führungsverhalten\n• Zusätzlich werden Erwartungshaltung an den eigenen Führungsstil und Motivation zur Weiterentwicklung sichtbar\n• Online, ca. 15 Minuten Bearbeitungsdauer\n• Entwicklungspotenzial wird sichtbar durch die Differenz zwischen Verhalten und eigenen Erwartungen\n• 13-seitiger Auswertungsbericht","s":""},
{"c":"6 Positive Leadership","q":"Erkläre die P-P-5-Technik.","a":"Schritt 1 – Positives 1: Die Stärke analysieren\nWas konkret läuft gut? Welche Beispiele gibt es? Warum funktioniert das gut? Welche Stärken stehen dahinter? Wer ist beteiligt? Wie geht es den Beteiligten, wenn es gut läuft?\n\nSchritt 2 – Positives 2: Potenziale im Entwicklungsfeld finden\nBereich mit dem größten Entwicklungspotenzial (niedrigster Wert und/oder größte Differenz). Was läuft in DIESEM Bereich bereits gut?\n\nSchritt 3 – 5 %: Konkrete Verbesserungs-Impulse\nWas kann getan werden, um den Bereich um 5 % zu verbessern? Was kann die Führungskraft selbst tun?","s":""},
{"c":"6 Positive Leadership","q":"Welche Evidenz gibt es für Positive Leadership im Krankenhaus (Ebner)?","a":"Fluktuation („Wie häufig haben Sie in den letzten 9 Monaten überlegt, Ihren Job zu verlassen?“):\nje höher das PERMA-Lead-Verhalten der Führungskraft, desto geringer die Fluktuationsneigung (3,3 → 1,9); r = -.291, p < 0,001\n\nBurnout:\nje höher das PERMA-Lead-Verhalten, desto geringer die Burnout-Werte (2,1 → 1,3); r = -.392, p < 0,001","s":"Ebner (2024)"},
{"c":"6 Positive Leadership","q":"Welche Grenzen und kritischen Punkte hat Positive Leadership?","a":"• Kein „Schönwetter-Konzept“: gerade in Krisen relevant; bedeutet nicht, Schwierigkeiten zu ignorieren\n• Authentizität ist entscheidend: aufgesetzte Positivität ist kontraproduktiv; die Haltung muss echt und die Praxis konsistent sein\n• Anspruchsvoll für die Führungskraft: erfordert hohe Selbstreflexion, emotionale Intelligenz und die Bereitschaft, traditionelle Machtstrukturen zu hinterfragen\n• Kontextabhängigkeit: Ein rein positiver Ansatz kann in hochgradig sicherheitskritischen oder akuten Notfallsituationen unangebracht sein","s":""},

{"c":"7 Kritik & Grenzen","q":"Kritik an der Positiven Psychologie: Was ist mit „Oberflächlichkeit“ gemeint?","a":"• Wenig differenzierte Betrachtung im Vergleich zu anderen (Forschungs-)strömungen\n• Konstrukte wie Glück, Freude, Zufriedenheit und Wohlbefinden sind komplex und dürfen nicht eindimensional betrachtet werden\n• Gesellschaftliche und biographische Voraussetzungen sowie Lebensbedingungen wirken als mögliche Moderatorvariablen und müssen berücksichtigt werden","s":"Mayring (2012)"},
{"c":"7 Kritik & Grenzen","q":"Welche sechs Ideologiemerkmale nach Salamun lassen sich in der Positiven Psychologie identifizieren?","a":"1. Absolutheits- und Ausschließlichkeitsansprüche\n2. Charismatische Führungspersonen\n3. Immunisierungsstrategien durch Leerformeln, Suggestivdefinitionen und Zirkelargumente\n4. Dichotomisierende Denkformeln\n5. Dogmatisch-ganzheitliche Denkformeln\n6. Utopisch-messianische Heilsideen","s":"Salamun (2001); Mayring (2012)"},
{"c":"7 Kritik & Grenzen","q":"Kritik: Absolutheits- und Ausschließlichkeitsansprüche – Belege und Gegenfrage?","a":"Belege:\n• „A positive clinical psychology grounded in positive psychology's ideology of health, happiness and human strengths“ (Maddux et al., 2004)\n• „Positive psychology represents a potential ›golden era‹ in 21th-century America“ (Snyder & Lopez, 2007)\n\nGegenfrage: Wird dadurch wirklich der Ethos und das Tun der bisherigen psychologischen Richtungen in Frage gestellt?","s":""},
{"c":"7 Kritik & Grenzen","q":"Kritik: Charismatische Führungspersonen – Vorwurf und Gegenfrage?","a":"Vorwurf: Seligman als Begründer und Repräsentant der Positiven Psychologie, der Weltgemeinschaft für Positive Psychologie sowie diverser Studiengänge.\n\nGegenfrage: Inwiefern haben wir das in anderen Richtungen der Psychologie nicht auch (gehabt), z. B. Freud?","s":""},
{"c":"7 Kritik & Grenzen","q":"Kritik: Immunisierungsstrategien durch Leerformeln – Belege und Gegenfrage?","a":"Belege:\n• „Uncovering people's strengths and promoting their positive functioning“ (Snyder & Lopez, 2007)\n• „Cultivating positive emotions to optimize health and well-being“ (Fredrickson, 2000)\n\nGegenfrage: Inwiefern sind dies wirklich Leerformeln und Suggestionen? Was ist daran negativ? Wie würde uns eine Perspektive im Sinne der Pathologie weiterbringen?","s":""},
{"c":"7 Kritik & Grenzen","q":"Kritik: Dichotomisierende Denkformeln – worum geht es?","a":"• Klare Dichotomisierung von Pathologie vs. Positiver Psychologie\n• Es wird der Anschein erweckt, andere Richtungen hätten sich noch nicht mit Stärken, Gesundheit und einer positiven Sichtweise beschäftigt\n\nGegenfrage/Einordnung: Was verbessert sich durch diese Perspektive? Auch die WHO-Gesundheitsdefinition enthält bereits Wohlbefinden. Positive Psychologie ist eher Ergänzung und Erweiterung als Ersatz.","s":""},
{"c":"7 Kritik & Grenzen","q":"Kritik: Dogmatisch-ganzheitliche Denkformeln – worum geht es?","a":"• Die feste Struktur von sechs Tugenden und 24 Stärken (VIA)\n• Fehlende und zu vereinfacht dargestellte empirische Erkenntnisse\n\nGegenfrage: In welchen anderen Disziplinen und psychologischen Richtungen finden wir Ähnliches?","s":""},
{"c":"7 Kritik & Grenzen","q":"Was ist mit „Zwangsbeglückung“ gemeint?","a":"Kritik, dass Positive Psychologie das Glücklichsein zur Pflicht macht:\n• „Zwangsbeglückung“ (Utsch, 2011)\n• „Aufgabe, das Glück zu finden“ (Ahmed, 2010)\n\nHintergrund: Steigendes Angebot von und Nachfrage nach Coaching/Trainings zur mentalen Stärke und Selbstoptimierung – bei gleichzeitig steigender Nachfrage nach Psychotherapie und steigender Zahl diagnostizierter psychischer Erkrankungen.\n\nDiskussionsfrage: Spricht das pro oder contra Positive Psychologie – und warum?","s":""},
{"c":"7 Kritik & Grenzen","q":"Warum sind negative Emotionen aus Sicht einer seriösen Positiven Psychologie wichtig?","a":"Negative Emotionen sind funktional: Angst, Ärger, Trauer oder Frustration können warnen, Grenzen anzeigen oder Veränderung anstoßen.\n\nProblematisch wird Positive Psychologie erst, wenn negative Emotionen abgewertet oder verdrängt werden (toxische Positivität).\n\nWohlbefinden ist mehrdimensional: nicht nur positive Emotionen, sondern auch Sinn, Beziehungen, Engagement, Leistungserleben und Vitalität.","s":""},
{"c":"7 Kritik & Grenzen","q":"„Was ist dran an der Kritik?“ – Nenne vier Gegenargumente.","a":"1) Es gab einen proaktiven Reform-Prozess innerhalb der Disziplin mit stark partizipativem Forschungsansatz und engem Austausch zwischen Forschung und Praxis.\n2) Eigentlich eher ein Miteinander als ein Gegeneinander: Positive Psychologie als interdisziplinärer Raum.\n3) Seriöse Positive Psychologie fordert nicht permanente positive Emotionen – Wohlbefinden ist mehrdimensional, negative Emotionen sind funktional.\n4) Die Forschung schreitet voran und muss weiter voranschreiten – wie in anderen Bereichen der Psychologie auch.","s":"Van Zyl (2025), Frontiers in Psychology"},
{"c":"7 Kritik & Grenzen","q":"Wie sollte Kritik an der Positiven Psychologie in der Klausur eingeordnet werden?","a":"Kritik nicht als Widerlegung der Positiven Psychologie verstehen, sondern als Aufforderung zu differenzierter, kontextsensibler Anwendung.\n\nErwartet wird: Kritikpunkte nicht nur aufzählen, sondern diskutieren – Was ist berechtigt? Was ist verkürzt? Wie kann eine seriöse Positive Psychologie damit umgehen?","s":""},
{"c":"7 Kritik & Grenzen","q":"Wie verändert sich die Positive Psychologie aktuell?","a":"• Positive Psychologie verändert sich und muss nicht dogmatisch sein\n• Aktuelle Entwicklungen betonen stärkere Differenzierung, Forschungsnähe, Praxisbezug und interdisziplinären Austausch\n• Die 4. Welle thematisiert u. a. posttraumatisches Wachstum (Mangelsdorf)","s":""},

{"c":"8 Transferaufgabe (Sophie)","i":300,"q":"Fall Sophie – wie lautet die kurze Fallanalyse zum Einstieg?","a":"Sophie verfügt über hohe fachliche Kompetenz (skill), ihre Aufgaben bieten seit der Umstrukturierung jedoch zu geringe Anforderungen (challenge). Die Passung zwischen Fähigkeit und Herausforderung ist gestört, ihre Charakterstärke Kreativität kann kaum noch gelebt werden.\n\nIm PERMA-Modell sind vor allem E (Engagement), A (Accomplishment) und M (Meaning) beeinträchtigt; die häufigeren Flüchtigkeitsfehler sind ein typisches Symptom von Unterforderung, nicht von Überforderung.","s":"1–2 Sätze zu Beginn – zeigt die theoretische Einordnung und bringt Punkte."},

{"c":"8 Transferaufgabe (Sophie)","i":301,"q":"Aufgabe 1 – Wie lautet das Oberziel der Intervention?","a":"Sophie entwickelt innerhalb von vier Wochen wieder mehr Engagement, Flow-Erleben und Selbstwirksamkeit in ihrem Arbeitsalltag, indem sie\n\n• ihre kreativen Stärken bewusst identifiziert,\n• sie gezielt in bestehende Aufgaben einbringt und\n• ihre Gestaltungsspielräume aktiv nutzt.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":302,"q":"Aufgabe 1 – Nenne die vier konkretisierten Teilziele.","a":"1) Sophie kann am Ende mindestens drei eigene Charakterstärken benennen und jeweils eine konkrete Arbeitssituation beschreiben, in der sie diese einsetzt.\n\n2) Sophie erhöht den Anteil an Tätigkeiten mit kreativem bzw. gestalterischem Anteil um mindestens zwei Stunden pro Woche (Job Crafting im vorhandenen Spielraum).\n\n3) Sophies Flow-Erleben steigt im Prä-Post-Vergleich der Flow-Kurzskala messbar an.\n\n4) Sophie hat ein vorbereitetes Gespräch mit ihrer Führungskraft mit mindestens zwei konkreten, realistischen Vorschlägen zur Aufgabenanreicherung.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":303,"q":"Aufgabe 1 – Wie lautet der Formulierungsbaustein für das Ziel?","a":"„Ziel ist nicht die Beseitigung der Umstrukturierung, sondern die Wiederherstellung von Wohlbefinden im Sinne von PERMA – konkret die Stärkung von Engagement, Accomplishment und Meaning innerhalb des Einflussbereichs von Sophie.“","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":304,"q":"Aufgabe 1 – Warum bringt genau diese Zielformulierung Punkte?","a":"Sie ist\n\na) auf das Wohlbefinden bezogen,\nb) konkret und überprüfbar,\nc) im Vier-Wochen-Zeitraum realistisch und\nd) im Einflussbereich der Klientin (Covey) verortet.\n\nSie überfordert damit weder die Person noch das Coaching-Setting.","s":""},

{"c":"8 Transferaufgabe (Sophie)","i":305,"q":"Aufgabe 2 – Welche theoretische Grundlage wird gewählt?","a":"Flow-Theorie (Csikszentmihályi) und Stärkenorientierung (Seligman & Peterson; Ebner), eingebettet in das PERMA-Modell (Seligman).\n\nDie Begründung erfolgt in drei Schritten: Flow erklärt den Mechanismus, die Stärkenorientierung den Energie- und Selbstwertverlust, PERMA liefert den Rahmen für Diagnostik, Zielsetzung und Evaluation.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":306,"q":"Aufgabe 2 – Begründung Schritt 1: Wie erklärt die Flow-Theorie den Fall?","a":"Flow ist der Zustand des vollkommenen und reflexionsfreien Vertiefens in eine Tätigkeit, die herausfordernd ist und dennoch optimal gelingt. Er entsteht in der Balance zwischen persönlicher Fähigkeit (skill) und Anforderung der Aufgabe (challenge).\n\nGenau diese Balance ist gestört: hohe Fähigkeiten treffen auf zu geringe Anforderungen → Langeweile.\n\nDas erklärt\n• ihre Selbstbeschreibung („langweilig und zermürbend“),\n• die nachlassende Konzentration (Flüchtigkeitsfehler) und\n• die abendliche Erschöpfung.\n\nFlow wirkt affektiv, kognitiv und konativ – alle drei Ebenen sind bei ihr betroffen.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":307,"q":"Aufgabe 2 – Begründung Schritt 2: Wie erklärt die Stärkenorientierung den Fall?","a":"Charakterstärken sind psychologische Merkmale, die Tugenden definieren, Teil der Persönlichkeit sind und relativ stabil bleiben.\n\nLaut Stärken-Check gilt:\n• Eine Stärke gibt Energie, wenn man sie auslebt.\n• Es fehlt etwas, wenn man sie nicht ausleben kann.\n• Es kostet Energie, sie zurückzuhalten.\n\nSophie kann ihre kreative Kernkompetenz nicht mehr einsetzen – damit ist ihr Zustand theoretisch exakt vorhergesagt: Energieverlust und ein angegriffenes Selbstwertgefühl.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":308,"q":"Aufgabe 2 – Begründung Schritt 3: Was leistet PERMA in diesem Fall?","a":"PERMA erlaubt eine differenzierte Analyse statt einer pauschalen Aussage über „Zufriedenheit“:\n\nBeeinträchtigt sind\n• Engagement (kein Flow),\n• Accomplishment (kein Kompetenz- und Fortschrittserleben),\n• Meaning (kein erkennbarer Beitrag zu etwas Größerem).\n\nNicht beeinträchtigt sind – soweit im Fall erkennbar – Relationships und Vitalität.\n\n→ Damit lässt sich die Intervention präzise ansetzen.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":309,"q":"Aufgabe 2 – Wie grenzt man Resilienz und Broaden-and-Build ab?","a":"Resilienz wäre die schwächere Wahl:\n• Es liegt keine Krise oder Widrigkeit im Sinne der APA-Definition vor, sondern ein Passungsproblem.\n• Resilienztraining würde die Ursache individualisieren (Kritikpunkt „Victim Blaming“), statt die Arbeitsgestaltung zu adressieren.\n\nBroaden-and-Build kann ergänzend herangezogen werden:\n• Positive Emotionen erweitern Denk- und Handlungsspielräume.\n• Sie sind Voraussetzung dafür, dass Sophie überhaupt Alternativen und Gestaltungsmöglichkeiten erkennt (Weitblick statt Tunnelblick).","s":"Die Abgrenzung bringt Zusatzpunkte."},

{"c":"8 Transferaufgabe (Sophie)","i":310,"q":"Aufgabe 3 – Welches Format und welche vier Wochenthemen?","a":"Format je Woche: ein Coaching-Termin à 60 Minuten plus Eigenarbeit. Jede Woche enthält Psychoedukation, mindestens eine praktische Übung und Selbstreflexion.\n\nWoche 1: Standortbestimmung und Verstehen\nWoche 2: Stärken identifizieren\nWoche 3: Job Crafting – Stärken in den Alltag bringen\nWoche 4: Verstetigung, Selbstwirksamkeit und Gesprächsvorbereitung","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":311,"q":"Aufgabe 3 – Woche 1: Standortbestimmung und Verstehen","a":"PSYCHOEDUKATION\nFlow-Modell: Balance skill × challenge; Unterforderung → Langeweile, Überforderung → Angst. Wirkungen von Flow (affektiv, kognitiv, konativ). PERMA einführen. Entlastende Normalisierung: Die Symptome sind eine erwartbare Folge fehlender Passung, kein persönliches Versagen.\n\nÜBUNG – Energie-Landkarte\nAlle Tätigkeiten der letzten Arbeitswoche auflisten und in „Energiegeber“ / „neutral“ / „Energieräuber“ sortieren. Je Tätigkeit Anforderung und eigene Fähigkeit auf einer Skala 1–10 einschätzen.\n\nSELBSTREFLEXION\nWann habe ich zuletzt Energie, Kreativität und Kompetenz erlebt? Welche PERMA-Elemente sind schwach? Woran merke ich die Unterforderung?\n\nHAUSAUFGABE\nFlow-Kurzskala an drei Tagen direkt nach einer Arbeitstätigkeit ausfüllen.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":312,"q":"Aufgabe 3 – Woche 2: Stärken identifizieren","a":"PSYCHOEDUKATION\nCharakterstärken als individuelle Energiequellen (Seligman & Peterson). Stärken-Check in vier Schritten: gibt Energie / fehlt, wenn ungelebt / Zurückhalten kostet Kraft / Übertreibung möglich. Abgrenzung: Stärkenorientierung ist kein Schönreden.\n\nÜBUNG – Stärkeninterview\n„Wann fühlen Sie sich energiegeladen und authentisch?“, „Was fällt Ihnen leicht?“, „Wofür bekommen Sie Komplimente?“ Ergänzend VIA-Stärkentest. Anschließend drei Signaturstärken auswählen und je eine gelungene Vergangenheitssituation beschreiben.\n\nSELBSTREFLEXION\nWelche Stärke konnte ich in den letzten sechs Monaten am wenigsten leben? Was fehlt mir dadurch? Wo zeigt sie sich trotzdem noch – auch im Kleinen?\n\nHAUSAUFGABE\nTäglich notieren: „Heute habe ich meine Stärke ___ eingesetzt, als ich ___.“","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":313,"q":"Aufgabe 3 – Woche 3: Job Crafting – Stärken in den Alltag bringen","a":"PSYCHOEDUKATION\nEinflussbereich vs. Betroffenheitsbereich (Covey): Die Umstrukturierung liegt im Betroffenheitsbereich, die Ausgestaltung einzelner Aufgaben im Einflussbereich. Lösungs- und Möglichkeits-Talk: „Was funktioniert schon gut?“ statt „Warum klappt das nicht?“\n\nÜBUNG – Task Crafting nach dem 5-%-Prinzip (angelehnt an P-P-5)\n1) Welche Aufgabe läuft bereits gut und warum?\n2) Welche Routineaufgabe hat verstecktes Gestaltungspotenzial?\n3) Was macht sie um 5 % kreativer oder anspruchsvoller?\nKonkret: eine standardisierte Werbevorlage gestalterisch variieren, ein Mini-Konzept für ein internes Format entwickeln, Kolleg:innen ein Layout-Review anbieten. Mindestens zwei Maßnahmen umsetzen.\n\nSELBSTREFLEXION\nWie haben sich Energie, Konzentration, Fehlerquote und Zufriedenheit an diesen Tagen verändert? Wo lag die Anforderung näher an meinen Fähigkeiten?\n\nHAUSAUFGABE\nFlow-Kurzskala erneut ausfüllen – nach einer „gecrafteten“ Aufgabe, als Vergleich zu Woche 1.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":314,"q":"Aufgabe 3 – Woche 4: Verstetigung, Selbstwirksamkeit und Gesprächsvorbereitung","a":"PSYCHOEDUKATION\nAccomplishment und Selbstwirksamkeit: Fortschritt wirkt nur, wenn er sichtbar gemacht wird. Bezug zu Broaden-and-Build: Erste Erfolge erzeugen positive Emotionen, die den Möglichkeitsraum erweitern (Aufwärtsspirale).\n\nÜBUNG – Erfolgsbilanz und Gesprächsvorbereitung\nÜbersicht der Veränderungen der letzten drei Wochen (Was hat gewirkt? Woran war das erkennbar?). Darauf aufbauend ein Gespräch mit der Führungskraft vorbereiten – stärken- und nutzenargumentiert, nicht beschwerdeorientiert: „Wenn ich X % meiner Zeit für konzeptionelle Arbeit einsetze, entsteht für das Team folgender Nutzen: …“ Anschließend Rollenspiel.\n\nSELBSTREFLEXION\nWas liegt weiterhin in meinem Einflussbereich? Welche zwei Routinen behalte ich bei? Woran merke ich frühzeitig, dass ich wieder in Unterforderung rutsche?\n\nABSCHLUSS\nPost-Messung aller Instrumente, Transfervereinbarung, Follow-up nach acht Wochen.","s":""},

{"c":"8 Transferaufgabe (Sophie)","i":315,"q":"Aufgabe 4 – Welches übergeordnete Design und welche Messzeitpunkte?","a":"Prä-Post-Vergleich im Einzelfall (Single-Case) mit Follow-up.\n\nMesszeitpunkte:\n• t0 vor Woche 1 (Baseline)\n• t1 nach Woche 4\n• t2 Follow-up nach acht Wochen\n\nErgänzt um eine wöchentliche Verlaufsmessung, um nicht nur das Ergebnis, sondern auch den Verlauf abzubilden.\n\nMixed Methods: Zahlen zeigen, OB sich etwas verändert hat – die qualitativen Daten zeigen, WIE und WARUM.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":316,"q":"Aufgabe 4 – Welche quantitativen Indikatoren und Instrumente?","a":"• Flow-Erleben → Flow-Kurzskala (FKS), Rheinberg, Vollmeyer & Engeser (2019); 7-stufig; Subskalen Flow, Besorgnis, Passung | t0, wöchentlich, t1, t2\n\n• Wohlbefinden gesamt → PERMA-Selbsteinschätzung (je Element 0–10), ggf. PERMA-Profiler | t0, t1, t2\n\n• Lebenszufriedenheit → SWLS (Janke & Glöckner-Rist, 2012) oder HSWBS (Dalbert, 2002) als distales Kriterium | t0, t1, t2\n\n• Energie und Zufriedenheit → wöchentliche Single-Item-Ratings 1–10\n\n• Stärkennutzung → „Ich konnte diese Woche meine Stärken einsetzen“ (1–10), wöchentlich\n\n• Arbeitsnah und objektivierbar → Anteil kreativ-konzeptioneller Tätigkeiten in % (Tätigkeitsprotokoll); Anzahl selbst bemerkter Flüchtigkeitsfehler pro Woche","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":317,"q":"Aufgabe 4 – Wie werden die quantitativen Daten ausgewertet?","a":"• Mittelwertvergleich t0 gegenüber t1 je Skala\n• Darstellung der Wochenwerte als Verlaufskurve\n• Berechnung individueller Veränderungswerte\n• Prüfung, ob die Veränderung über die normale Schwankungsbreite der Baseline hinausgeht","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":318,"q":"Aufgabe 4 – Welche kritische Einordnung gehört unbedingt dazu?","a":"Es handelt sich um ein N = 1-Design ohne Kontrollgruppe. Kausalaussagen sind nicht möglich.\n\nNicht auszuschließende Alternativerklärungen:\n• Erwartungseffekte\n• soziale Erwünschtheit\n• Reifungs- und Testwiederholungseffekte\n• parallele Veränderungen im Betrieb\n\nAussagekraft entsteht durch die mehrfache Baseline-Messung, die Kombination mehrerer Indikatoren und die Triangulation mit qualitativen Daten.","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":319,"q":"Aufgabe 4 – Welche qualitativen Instrumente und wie wird ausgewertet?","a":"• Strukturiertes Reflexionstagebuch (wöchentlich, feste Leitfragen): Wann war ich „im Fluss“? Welche Stärke habe ich eingesetzt – und was hat das mit mir gemacht? Was hat Energie gekostet? Was war anders als vorher?\n\n• Leitfadengestütztes Abschlussinterview (t1): „Was hat sich verändert – woran machen Sie das fest?“, „Welche Übung war am wirksamsten und warum?“, „Was hat nicht funktioniert?“, „Wie erleben Sie heute Ihre eigene Kompetenz?“\n\n• Kritische Ereignisse: zwei bis drei besonders gelungene und zwei besonders schwierige Arbeitssituationen detailliert dokumentieren\n\n• Fremdperspektive (optional, nur mit Einverständnis): kurzes Feedback von Führungskraft oder Kolleg:in → Triangulation\n\nAUSWERTUNG\nQualitative Inhaltsanalyse (Mayring): Kategorienbildung zu Flow-Erleben, Stärkennutzung, Selbstwirksamkeit, Selbstwert und Gestaltungsspielraum; Kategoriensystem und Ankerbeispiele dokumentieren (Nachvollziehbarkeit als Gütekriterium).","s":""},
{"c":"8 Transferaufgabe (Sophie)","i":320,"q":"Aufgabe 4 – Wann gilt die Intervention als erfolgreich? (4 Kriterien)","a":"1) Flow-Kurzskala und PERMA-Selbsteinschätzung zeigen von t0 zu t1 eine Verbesserung, die über die Baseline-Schwankung hinausgeht.\n\n2) Der Anteil kreativ-konzeptioneller Tätigkeiten ist messbar gestiegen.\n\n3) Sophie kann im Abschlussinterview konkrete Situationen beschreiben, in denen sie Stärken eingesetzt und Wirksamkeit erlebt hat.\n\n4) Mindestens zwei Job-Crafting-Maßnahmen sind dauerhaft in den Alltag integriert (Nachweis im Follow-up t2).","s":""},

{"c":"8 Transferaufgabe (Sophie)","i":321,"q":"Optionaler Abschluss – welche vier Punkte zur kritischen Reflexion?","a":"1) GRENZE DER INDIVIDUELLEN INTERVENTION\nDie Ursache liegt teilweise strukturell (Umstrukturierung, Aufgabenzuschnitt). Ein rein individuelles Coaching würde ein organisationales Problem individualisieren – genau der Kritikpunkt „Individualisierung / Victim Blaming“. Deshalb ist das Gespräch mit der Führungskraft in Woche 4 inhaltlich notwendig, kein bloßes Extra.\n\n2) ANSCHLUSS AN POSITIVE LEADERSHIP\nNachhaltig wird die Veränderung erst, wenn die Führungskraft Aufgaben stärkenorientiert zuschneidet (PERMA-Lead: Engagement ermöglichen, Erreichtes sichtbar machen).\n\n3) KEINE TOXISCHE POSITIVITÄT\nSophies Frustration wird anerkannt, nicht umgedeutet. Negative Emotionen sind funktional – sie zeigen hier zutreffend eine Fehlpassung an.\n\n4) MESSGRENZEN\nSelbstauskunftsverfahren sind anfällig für soziale Erwünschtheit – deshalb die Ergänzung um verhaltensnahe Indikatoren.","s":"Bringt in der Regel Zusatzpunkte, wenn am Ende Zeit bleibt."}
]
</script>

<script>
(function(){
  "use strict";
  var ALL = JSON.parse(document.getElementById('cards').textContent);
  // Karten mit eigenem "i" behalten ihre ID; alle anderen werden fortlaufend gezählt,
  // damit das Einfügen neuer Blöcke den gespeicherten Fortschritt nicht verschiebt.
  var seq = 0;
  ALL.forEach(function(c){ c.id = (c.i === undefined) ? seq++ : c.i; });

  var KEY = 'pospsy-progress-v1';
  var progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ progress = {}; }

  var el = function(id){ return document.getElementById(id); };
  var card = el('card'), qText = el('qText'), aText = el('aText'),
      srcText = el('srcText'), tagF = el('tagF'), tagB = el('tagB'),
      catSel = el('cat'), counter = el('counter'), stats = el('stats'),
      barFill = el('barFill'), modeBtn = el('modeBtn'), gfxBox = el('gfxBox');

  var queue = [], pos = 0, onlyHard = false;

  // Kategorien füllen
  var cats = ALL.reduce(function(acc,c){ if(acc.indexOf(c.c)<0) acc.push(c.c); return acc; }, []);
  var opt = document.createElement('option');
  opt.value = '*'; opt.textContent = 'Alle Themen (' + ALL.length + ')';
  catSel.appendChild(opt);
  cats.forEach(function(k){
    var n = ALL.filter(function(c){ return c.c === k; }).length;
    var o = document.createElement('option');
    o.value = k; o.textContent = k + ' (' + n + ')';
    catSel.appendChild(o);
  });
  catSel.value = localStorage.getItem(KEY + '-cat') || '*';

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(progress));
      localStorage.setItem(KEY + '-cat', catSel.value);
    } catch(e){}
  }

  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function build(keepShuffle){
    var sel = catSel.value;
    function inScope(c){ return sel === '*' || c.c === sel; }
    queue = ALL.filter(function(c){
      return inScope(c) && (!onlyHard || (progress[c.id] || 0) < 0);
    });
    if (!queue.length){
      onlyHard = false;
      modeBtn.textContent = 'Alle';
      modeBtn.classList.remove('on');
      queue = ALL.filter(inScope);
    }
    if (keepShuffle !== false) shuffle(queue);
    pos = 0;
    render();
  }

  function render(){
    if (!queue.length) return;
    if (pos >= queue.length) pos = 0;
    if (pos < 0) pos = queue.length - 1;
    var c = queue[pos];
    card.classList.remove('flipped');
    tagF.textContent = c.c;
    tagB.textContent = c.c;
    qText.textContent = c.q;
    aText.textContent = c.a;
    // Nur autoreigene, fest hinterlegte SVG-Grafiken – keine Nutzereingaben.
    gfxBox.innerHTML = c.g || '';
    srcText.textContent = c.s ? 'Quelle: ' + c.s : '';
    counter.textContent = 'Karte ' + (pos + 1) + ' / ' + queue.length;

    var scope = ALL.filter(function(x){ return catSel.value === '*' || x.c === catSel.value; });
    var known = scope.filter(function(x){ return (progress[x.id] || 0) > 0; }).length;
    var hard  = scope.filter(function(x){ return (progress[x.id] || 0) < 0; }).length;
    stats.textContent = '✔ ' + known + '  ·  ↻ ' + hard;
    barFill.style.width = (scope.length ? (known / scope.length * 100) : 0) + '%';
    card.querySelector('.front').scrollTop = 0;
    card.querySelector('.back').scrollTop = 0;
  }

  function flip(){ card.classList.toggle('flipped'); }
  function next(){ pos++; render(); }
  function prev(){ pos--; render(); }

  function mark(v){
    var c = queue[pos];
    progress[c.id] = v;
    save();
    next();
  }

  card.addEventListener('click', flip);
  el('btnFlip').addEventListener('click', function(e){ e.stopPropagation(); flip(); });
  el('btnGood').addEventListener('click', function(){ mark(1); });
  el('btnAgain').addEventListener('click', function(){ mark(-1); });
  el('btnNext').addEventListener('click', next);
  el('btnPrev').addEventListener('click', prev);
  el('shuffle').addEventListener('click', function(){ shuffle(queue); pos = 0; render(); });
  catSel.addEventListener('change', function(){ save(); build(); });

  modeBtn.addEventListener('click', function(){
    onlyHard = !onlyHard;
    modeBtn.textContent = onlyHard ? 'Nur ↻' : 'Alle';
    modeBtn.classList.toggle('on', onlyHard);
    build();
  });

  el('btnReset').addEventListener('click', function(){
    if (!confirm('Fortschritt wirklich zurücksetzen?')) return;
    progress = {}; save(); build();
  });

  // Tastatur (Desktop)
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === '1') mark(-1);
    else if (e.key === '2') mark(1);
  });

  // Wischgesten
  var sx = 0, sy = 0, moved = false;
  card.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; moved = false;
  }, {passive:true});
  card.addEventListener('touchmove', function(){ moved = true; }, {passive:true});
  card.addEventListener('touchend', function(e){
    if (!moved) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if (dx < 0) next(); else prev();
    }
  }, {passive:true});

  build();

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
